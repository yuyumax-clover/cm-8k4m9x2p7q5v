<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CiteMap — 論文引用関係・引用文言エクスプローラー</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .canvas-scroll::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .canvas-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .canvas-scroll::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .canvas-scroll::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .paper-card {
      transition: box-shadow 0.15s ease, transform 0.15s ease, border-color 0.15s ease;
      user-select: none;
    }
    .paper-card:hover {
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.12), 0 4px 10px -2px rgba(15, 23, 42, 0.06);
      z-index: 30 !important;
    }
    .edge-path {
      transition: stroke-width 0.15s ease, opacity 0.15s ease;
      cursor: pointer;
    }
    .edge-path:hover {
      stroke-width: 3.5px !important;
      opacity: 1 !important;
    }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 shrink-0 z-40">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-amber-400 border-2 border-amber-500 flex items-center justify-center shadow-sm">
        <svg class="w-5 h-5 text-slate-900" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14" />
        </svg>
      </div>
      <div>
        <h1 class="text-base font-bold text-slate-900 leading-tight">CiteMap</h1>
        <p class="text-xs text-slate-500">出版年 × 分野テーマで論文の引用関係と本文中の引用文言を可視化</p>
      </div>
    </div>

    <!-- Search & Intent Filter -->
    <div class="flex flex-wrap items-center gap-2 flex-1 max-w-2xl justify-end">
      <div class="relative flex-1 min-w-[200px] max-w-xs">
        <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" />
        </svg>
        <input id="searchInput" type="text" placeholder="タイトル・著者・引用文言を検索..." class="w-full pl-9 pr-3 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white" />
      </div>

      <select id="intentFilter" class="text-xs font-medium bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400">
        <option value="all">すべての引用タイプ</option>
        <option value="background">基礎・先行研究</option>
        <option value="method">手法・プロトコル採用</option>
        <option value="comparison">比較・ベンチマーク</option>
        <option value="extension">課題指摘・拡張</option>
      </select>

      <select id="statusFilter" class="text-xs font-medium bg-slate-50 border border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-700 focus:outline-none focus:ring-2 focus:ring-amber-400">
        <option value="all">すべての印</option>
        <option value="read">✅ 読了のみ</option>
        <option value="important">★ 大事のみ</option>
        <option value="review">📌 要確認のみ</option>
        <option value="unread">未読のみ</option>
      </select>
    </div>

    <!-- Action Buttons -->
    <div class="flex flex-wrap items-center gap-1.5">
      <button id="btnUndo" type="button" disabled class="px-2.5 py-1.5 text-xs font-medium bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-lg transition disabled:opacity-40 disabled:cursor-not-allowed" title="1つ前の操作に戻す (Ctrl+Z / Cmd+Z)">
        ↩ 元に戻す
      </button>
      <button id="btnAddPaper" type="button" class="px-3 py-1.5 text-xs font-semibold bg-amber-400 hover:bg-amber-500 text-slate-900 rounded-lg shadow-sm transition flex items-center gap-1">
        <span>+</span> 論文を追加
      </button>
      <button id="btnAddLink" type="button" class="px-3 py-1.5 text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-white rounded-lg shadow-sm transition flex items-center gap-1">
        <span>+</span> 引用線を追加
      </button>
      <button id="btnManageThemes" type="button" class="px-2.5 py-1.5 text-xs font-medium bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-lg transition">
        テーマ設定
      </button>
      <button id="btnAutoClassify" type="button" class="px-2.5 py-1.5 text-xs font-semibold bg-emerald-50 hover:bg-emerald-100 text-emerald-800 border border-emerald-200 rounded-lg transition" title="論文内容やOpenAlexトピックから横軸の分類案を自動提案・振り分け">
        横軸を自動提案
      </button>
      <button id="btnPaperpileImport" type="button" class="px-2.5 py-1.5 text-xs font-semibold bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-lg transition" title="PaperpileのBibTeXまたはJSONを一括インポート">
        Paperpile取込
      </button>
      <button id="btnRefreshOpenAlex" type="button" class="px-2.5 py-1.5 text-xs font-medium bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-lg transition" title="OpenAlex APIから最新の被引用数を取得">
        引用数更新
      </button>
      <button id="btnAutoLinkOpenAlex" type="button" class="px-2.5 py-1.5 text-xs font-medium bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-lg transition" title="OpenAlexの参考文献データからマップ内の論文同士を自動で線で結ぶ">
        引用線自動結線
      </button>
      <button id="btnBatchAiSummary" type="button" class="px-2.5 py-1.5 text-xs font-semibold bg-violet-50 hover:bg-violet-100 text-violet-800 border border-violet-200 rounded-lg transition" title="AI要約が未作成の論文にまとめてAI要約を生成">
        ✨ AI要約一括
      </button>
      <button id="btnCloudSync" type="button" class="px-2.5 py-1.5 text-xs font-semibold bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-lg transition inline-flex items-center gap-1.5" title="Googleスプレッドシートと自動同期">
        <span id="cloudSyncDot" class="w-2 h-2 rounded-full bg-slate-300"></span>
        スプレッドシート同期
      </button>
      <button id="btnDataIO" type="button" class="px-2.5 py-1.5 text-xs font-medium bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 rounded-lg transition">
        JSON入出力
      </button>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="flex-1 flex flex-col lg:flex-row overflow-hidden relative">

    <!-- Left/Center: 2D Citation Timeline Canvas -->
    <main class="flex-1 flex flex-col overflow-hidden bg-slate-100 relative">

      <!-- Legend & Quick Controls Bar -->
      <div class="bg-white/90 backdrop-blur border-b border-slate-200 px-4 py-1.5 flex flex-wrap items-center justify-between gap-2 text-xs shrink-0 z-30">
        <div class="flex flex-wrap items-center gap-x-4 gap-y-1">
          <div class="flex flex-wrap items-center gap-2.5">
            <span class="font-semibold text-slate-500">引用の文脈:</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-1 rounded-full bg-blue-500"></span>基礎・先行研究</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-1 rounded-full bg-emerald-500"></span>手法・プロトコル</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-1 rounded-full bg-amber-500"></span>比較・ベンチマーク</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-1 rounded-full bg-rose-500"></span>課題・拡張</span>
          </div>
          <span class="text-slate-300 hidden sm:inline">|</span>
          <div class="flex flex-wrap items-center gap-2">
            <span class="font-semibold text-slate-500">枠色(引用数):</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded border-2 border-slate-400 bg-white"></span>&lt;100</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded border-2 border-sky-500 bg-white"></span>100–999</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded border-2 border-emerald-500 bg-white"></span>1,000–1,999</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded border-2 border-amber-500 bg-white"></span>2,000–2,999</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-3 rounded border-2 border-rose-500 bg-white"></span>3,000+</span>
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <div class="inline-flex items-center bg-slate-100 rounded-lg p-0.5 border border-slate-200" role="group" aria-label="文献内文章の表示言語">
            <span class="text-[11px] font-semibold text-slate-500 px-1.5">文献文:</span>
            <button type="button" data-doc-lang="en" class="doc-lang-btn px-2 py-0.5 text-[11px] font-semibold rounded-md transition">EN</button>
            <button type="button" data-doc-lang="ja" class="doc-lang-btn px-2 py-0.5 text-[11px] font-semibold rounded-md transition">JA</button>
            <button type="button" data-doc-lang="both" class="doc-lang-btn px-2 py-0.5 text-[11px] font-semibold rounded-md transition">日英</button>
          </div>
          <span class="text-slate-300">|</span>
          <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-600 select-none" title="選択中の論文と直接つながる引用関係のみを強調表示します">
            <input id="toggleFocusMode" type="checkbox" class="rounded border-slate-300 text-amber-500 focus:ring-amber-400" />
            <span>選択論文のつながりのみ強調</span>
          </label>
          <span class="text-slate-300">|</span>
          <label class="inline-flex items-center gap-1.5 cursor-pointer text-slate-600 select-none">
            <input id="toggleQuotePills" type="checkbox" checked class="rounded border-slate-300 text-amber-500 focus:ring-amber-400" />
            <span>線上に引用メモアイコン表示</span>
          </label>
          <span class="text-slate-300">|</span>
          <div class="flex items-center gap-1">
            <button id="btnZoomOut" type="button" class="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold flex items-center justify-center">−</button>
            <span id="zoomLabel" class="w-11 text-center font-mono text-slate-600">100%</span>
            <button id="btnZoomIn" type="button" class="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold flex items-center justify-center">+</button>
            <button id="btnZoomReset" type="button" class="px-2 h-6 rounded bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] font-medium">100%</button>
          </div>
        </div>
      </div>

      <!-- Scrollable Map Viewport -->
      <div id="mapViewport" class="flex-1 overflow-auto canvas-scroll relative p-4">
        <div id="mapZoomContainer" class="origin-top-left transition-transform duration-150">
          <!-- Rendered dynamically by JS -->
        </div>
      </div>

      <!-- Bottom Hint -->
      <div class="bg-white/90 border-t border-slate-200 px-4 py-1 text-[11px] text-slate-500 flex items-center justify-between shrink-0">
        <span>ヒント: カードをクリックで詳細表示 ／ カードを左右にドラッグしてレーン内・レーン間の位置を調整 ／ 線または💬をクリックで本文中の引用文言を表示</span>
        <span id="statsSummary" class="font-medium text-slate-600"></span>
      </div>
    </main>

    <!-- Right: Inspector Panel -->
    <aside id="inspectorPanel" class="w-full lg:w-[400px] xl:w-[430px] bg-white border-t lg:border-t-0 lg:border-l border-slate-200 flex flex-col overflow-hidden shrink-0 max-h-[45vh] lg:max-h-none z-30">
      <div id="inspectorContent" class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- Rendered dynamically by JS -->
      </div>
    </aside>
  </div>

  <!-- Modal Backdrop -->
  <div id="modalBackdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
    <div id="modalBox" class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-xl max-h-[90vh] flex flex-col overflow-hidden">
      <div class="px-5 py-3.5 border-b border-slate-200 flex items-center justify-between">
        <h2 id="modalTitle" class="text-base font-bold text-slate-900">モーダル</h2>
        <button id="btnCloseModal" type="button" class="w-8 h-8 rounded-lg hover:bg-slate-100 text-slate-500 flex items-center justify-center text-lg">&times;</button>
      </div>
      <div id="modalBody" class="p-5 overflow-y-auto space-y-4 text-sm"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-xl shadow-lg opacity-0 pointer-events-none transition-opacity duration-200 z-50"></div>

  <script>
    // =========================================================================
    // Constants & Helpers
    // =========================================================================
    const STORAGE_KEY = 'citemap_explorer_v1';

    const INTENT_META = {
      background: { label: '基礎・先行研究', color: '#3b82f6', bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200' },
      method:     { label: '手法・プロトコル採用', color: '#10b981', bg: 'bg-emerald-50', text: 'text-emerald-700', border: 'border-emerald-200' },
      comparison: { label: '比較・ベンチマーク', color: '#f59e0b', bg: 'bg-amber-50', text: 'text-amber-800', border: 'border-amber-200' },
      extension:  { label: '課題指摘・拡張', color: '#f43f5e', bg: 'bg-rose-50', text: 'text-rose-700', border: 'border-rose-200' }
    };

    const LANE_WIDTH = 280;
    const AXIS_WIDTH = 96;
    const HEADER_HEIGHT = 56;
    const ROW_HEIGHT = 128;
    const CARD_WIDTH = 236;
    const CARD_HEIGHT = 92;

    function uid(prefix = 'id') {
      return `${prefix}_${Math.random().toString(36).slice(2, 9)}`;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(msg, duration = 2600) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('opacity-0');
      el.classList.add('opacity-100');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => {
        el.classList.remove('opacity-100');
        el.classList.add('opacity-0');
      }, duration);
    }

    // =========================================================================
    // Initial Grounded Sample Dataset (NV-Center Quantum Sensing)
    // =========================================================================
    function getDefaultData() {
      return {
        themes: [
          { id: 'theme_bg', name: '基礎・先行研究', color: '#6366f1' },
          { id: 'theme_method', name: '手法・実験', color: '#0ea5e9' },
          { id: 'theme_app', name: '応用・展開', color: '#10b981' },
          { id: 'theme_review', name: 'レビュー・理論', color: '#f59e0b' }
        ],
        papers: [],
        links: []
      };
    }

    // =========================================================================
    // Application State
    // =========================================================================
    let state = {
      themes: [],
      papers: [],
      links: [],
      selectedPaperId: null,
      selectedLinkId: null,
      searchQuery: '',
      intentFilter: 'all',
      zoom: 1,
      showQuotePills: true,
      docLang: 'en',
      focusMode: false,
      statusFilter: 'all'
    };

    let undoStack = [];
    let _lastSavedSnapshot = '';

    function updateUndoButton() {
      const btn = document.getElementById('btnUndo');
      if (btn) btn.disabled = undoStack.length === 0;
    }

    function undoLastAction() {
      if (undoStack.length === 0) {
        showToast('これ以上戻せる操作がありません');
        return;
      }
      try {
        const prev = JSON.parse(undoStack.pop());
        state.themes = prev.themes || [];
        state.papers = prev.papers || [];
        state.links = prev.links || [];
        if (state.selectedPaperId && !state.papers.some(p => p.id === state.selectedPaperId)) {
          state.selectedPaperId = state.papers[0]?.id || null;
        }
        if (state.selectedLinkId && !state.links.some(l => l.id === state.selectedLinkId)) {
          state.selectedLinkId = null;
        }
        _lastSavedSnapshot = JSON.stringify({ themes: state.themes, papers: state.papers, links: state.links });
        saveState({ skipUndo: true });
        updateUndoButton();
        renderMap();
        renderInspector();
        showToast('1つ前の状態に戻しました');
      } catch (e) {
        showToast('元に戻せませんでした');
      }
    }

    async function translateText(text, targetLang) {
      const clean = (text || '').trim();
      if (!clean) return '';
      const sl = targetLang === 'ja' ? 'en' : 'ja';
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${targetLang}&dt=t&q=${encodeURIComponent(clean.slice(0, 1800))}`;
        const resp = await fetch(url);
        if (!resp.ok) return '';
        const data = await resp.json();
        if (Array.isArray(data) && Array.isArray(data[0])) {
          return data[0].map(seg => seg[0] || '').join('');
        }
      } catch (e) {}
      return '';
    }

    async function autoTranslateVisibleInspector() {
      let changed = false;
      const tasks = [];

      if (state.selectedLinkId) {
        const lnk = state.links.find(l => l.id === state.selectedLinkId);
        if (lnk) {
          if ((state.docLang === 'ja' || state.docLang === 'both') && !lnk.quoteJa && lnk.quote) {
            tasks.push(translateText(lnk.quote, 'ja').then(res => { if (res) { lnk.quoteJa = res; changed = true; } }));
          } else if ((state.docLang === 'en' || state.docLang === 'both') && !lnk.quote && lnk.quoteJa) {
            tasks.push(translateText(lnk.quoteJa, 'en').then(res => { if (res) { lnk.quote = res; changed = true; } }));
          }
        }
      } else if (state.selectedPaperId) {
        const p = state.papers.find(x => x.id === state.selectedPaperId);
        if (p) {
          if ((state.docLang === 'ja' || state.docLang === 'both') && !p.summary && p.summaryEn) {
            tasks.push(translateText(p.summaryEn, 'ja').then(res => { if (res) { p.summary = res; changed = true; } }));
          } else if ((state.docLang === 'en' || state.docLang === 'both') && !p.summaryEn && p.summary) {
            tasks.push(translateText(p.summary, 'en').then(res => { if (res) { p.summaryEn = res; changed = true; } }));
          }
          if ((state.docLang === 'ja' || state.docLang === 'both') && !p.aiSummary && p.aiSummaryEn) {
            tasks.push(translateText(p.aiSummaryEn, 'ja').then(res => { if (res) { p.aiSummary = res; changed = true; } }));
          } else if ((state.docLang === 'en' || state.docLang === 'both') && !p.aiSummaryEn && p.aiSummary) {
            tasks.push(translateText(p.aiSummary, 'en').then(res => { if (res) { p.aiSummaryEn = res; changed = true; } }));
          }
          const relLinks = state.links.filter(l => l.sourceId === p.id || l.targetId === p.id).slice(0, 6);
          relLinks.forEach(lnk => {
            if ((state.docLang === 'ja' || state.docLang === 'both') && !lnk.quoteJa && lnk.quote) {
              tasks.push(translateText(lnk.quote, 'ja').then(res => { if (res) { lnk.quoteJa = res; changed = true; } }));
            }
          });
        }
      }

      if (tasks.length > 0) {
        await Promise.all(tasks);
        if (changed) {
          saveState({ skipUndo: true });
          renderInspector();
        }
      }
    }

    function setDocLang(lang) {
      state.docLang = lang;
      updateDocLangButtons();
      renderInspector();
      autoTranslateVisibleInspector();
    }

    function updateDocLangButtons() {
      document.querySelectorAll('.doc-lang-btn').forEach(btn => {
        const active = btn.getAttribute('data-doc-lang') === state.docLang;
        btn.className = active
          ? 'doc-lang-btn px-2 py-0.5 text-[11px] font-bold rounded-md transition bg-slate-900 text-white shadow-xs'
          : 'doc-lang-btn px-2 py-0.5 text-[11px] font-medium rounded-md transition text-slate-600 hover:text-slate-900';
      });
    }

    function renderBilingualBlock(enText, jaText, emptyMsg = '未登録') {
      const en = (enText || '').trim();
      const ja = (jaText || '').trim();
      if (!en && !ja) return `<span class="text-slate-400">${escapeHtml(emptyMsg)}</span>`;
      if (state.docLang === 'en') {
        if (en) return escapeHtml(en);
        return `${escapeHtml(ja)} <span class="text-[10px] opacity-70">(日本語のみ)</span>`;
      }
      if (state.docLang === 'ja') {
        if (ja) return escapeHtml(ja);
        return `${escapeHtml(en)} <span class="text-[10px] opacity-70">(原文のみ)</span>`;
      }
      // both
      const parts = [];
      if (en) parts.push(`<div class="font-serif">${escapeHtml(en)}</div>`);
      if (ja) parts.push(`<div class="mt-1.5 pt-1.5 border-t border-current/15 text-[11px] opacity-90 font-sans">${escapeHtml(ja)}</div>`);
      return parts.join('');
    }

    function loadState() {
      const def = getDefaultData();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.themes) && Array.isArray(parsed.papers) && Array.isArray(parsed.links)) {
            state.themes = parsed.themes;
            state.papers = parsed.papers;
            state.links = parsed.links;
            state.selectedPaperId = state.papers[0]?.id || null;
            return;
          }
        }
      } catch (e) {
        // Ignore storage errors
      }
      state.themes = def.themes;
      state.papers = def.papers;
      state.links = def.links;
    }

    function initUndoSnapshot() {
      _lastSavedSnapshot = JSON.stringify(serializeCleanState());
      updateUndoButton();
    }

    function serializeCleanState() {
      const cleanPapers = state.papers.map(p => {
        const { _referencedWorks, _slotKey, ...rest } = p;
        return rest;
      });
      return {
        themes: state.themes,
        papers: cleanPapers,
        links: state.links
      };
    }

    function saveState({ skipCloud = false, skipUndo = false } = {}) {
      const nextSnap = JSON.stringify(serializeCleanState());
      if (!skipUndo && _lastSavedSnapshot && nextSnap !== _lastSavedSnapshot) {
        undoStack.push(_lastSavedSnapshot);
        if (undoStack.length > 30) undoStack.shift();
      }
      _lastSavedSnapshot = nextSnap;
      updateUndoButton();
      try {
        localStorage.setItem(STORAGE_KEY, nextSnap);
      } catch (e) {
        // Ignore storage errors
      }
      if (!skipCloud) scheduleCloudPush();
    }

    // =========================================================================
    // Filtering & Layout Computation
    // =========================================================================
    function getFilteredData() {
      const q = state.searchQuery.trim().toLowerCase();
      const intent = state.intentFilter;

      // Filter links first by intent and query
      const matchingLinks = state.links.filter(lnk => {
        if (intent !== 'all' && lnk.intent !== intent) return false;
        if (!q) return true;
        const src = state.papers.find(p => p.id === lnk.sourceId);
        const tgt = state.papers.find(p => p.id === lnk.targetId);
        const inLink = (lnk.quote || '').toLowerCase().includes(q) ||
                       (lnk.quoteJa || '').toLowerCase().includes(q) ||
                       (lnk.note || '').toLowerCase().includes(q) ||
                       (lnk.section || '').toLowerCase().includes(q);
        const inSrc = src && ((src.title || '').toLowerCase().includes(q) || (src.authors || '').toLowerCase().includes(q));
        const inTgt = tgt && ((tgt.title || '').toLowerCase().includes(q) || (tgt.authors || '').toLowerCase().includes(q));
        return inLink || inSrc || inTgt;
      });

      const sf = state.statusFilter || 'all';
      const visiblePapers = state.papers.filter(p => {
        const marks = p.marks || {};
        if (sf === 'read' && !marks.read) return false;
        if (sf === 'important' && !marks.important) return false;
        if (sf === 'review' && !marks.review) return false;
        if (sf === 'unread' && marks.read) return false;
        if (!q && intent === 'all') return true;
        if (intent !== 'all') {
          const connected = matchingLinks.some(l => l.sourceId === p.id || l.targetId === p.id);
          if (!connected) return false;
        }
        if (!q) return true;
        const selfMatch = (p.title || '').toLowerCase().includes(q) ||
                          (p.authors || '').toLowerCase().includes(q) ||
                          (p.shortAuthor || '').toLowerCase().includes(q) ||
                          String(p.year).includes(q) ||
                          (p.summary || '').toLowerCase().includes(q) ||
                          (p.summaryEn || '').toLowerCase().includes(q);
        const linkMatch = matchingLinks.some(l => l.sourceId === p.id || l.targetId === p.id);
        return selfMatch || linkMatch;
      });

      return { visiblePapers, matchingLinks };
    }

    function getPubDateDisplay(p) {
      const d = (p.pubDate || '').trim();
      if (d) return d;
      return p.year ? String(p.year) : '';
    }

    function getSortDateKey(p) {
      const d = (p.pubDate || '').trim();
      const m = d.match(/^(\d{4})(?:-(\d{1,2}))?(?:-(\d{1,2}))?/);
      if (m) {
        const y = parseInt(m[1], 10) || 0;
        const mo = parseInt(m[2] || '0', 10) || 0;
        const da = parseInt(m[3] || '0', 10) || 0;
        return y * 10000 + mo * 100 + da;
      }
      return (Number(p.year) || 0) * 10000;
    }

    function computeLayout(visiblePapers) {
      // Sort papers chronologically by full publication date (YYYY-MM-DD)
      const sortedPapers = [...visiblePapers].sort((a, b) => {
        const ka = getSortDateKey(a), kb = getSortDateKey(b);
        if (ka !== kb) return ka - kb;
        return (a.title || '').localeCompare(b.title || '');
      });

      // Build ordered unique date slots (YYYY-MM-DD / YYYY-MM / YYYY)
      const dateSlots = [];
      const slotMap = {};
      sortedPapers.forEach(p => {
        const label = getPubDateDisplay(p) || '不明';
        const key = `${getSortDateKey(p)}__${label}`;
        if (!slotMap[key]) {
          slotMap[key] = { key, label, sortKey: getSortDateKey(p), year: Number(p.year) || 0 };
          dateSlots.push(slotMap[key]);
        }
        p._slotKey = key;
      });

      // Group papers by (dateSlot, themeId) to prevent same-cell overlap
      const cellGroups = {};
      sortedPapers.forEach(p => {
        const cKey = `${p._slotKey}__${p.themeId}`;
        if (!cellGroups[cKey]) cellGroups[cKey] = [];
        cellGroups[cKey].push(p);
      });

      const CARD_GAP_Y = 16;
      const CARD_GAP_X = 16;
      const slotTop = {};
      let currentY = HEADER_HEIGHT;
      dateSlots.forEach(slot => {
        slotTop[slot.key] = currentY;
        let maxInCell = 1;
        state.themes.forEach(t => {
          const cnt = (cellGroups[`${slot.key}__${t.id}`] || []).length;
          if (cnt > maxInCell) maxInCell = cnt;
        });
        const neededHeight = 20 + maxInCell * CARD_HEIGHT + Math.max(0, maxInCell - 1) * CARD_GAP_Y + 20;
        currentY += Math.max(ROW_HEIGHT, neededHeight);
      });

      const positions = {};
      sortedPapers.forEach(p => {
        const themeIdx = Math.max(0, state.themes.findIndex(t => t.id === p.themeId));
        const group = cellGroups[`${p._slotKey}__${p.themeId}`] || [p];
        const idxInGroup = group.indexOf(p);

        const baseX = AXIS_WIDTH + themeIdx * LANE_WIDTH + (LANE_WIDTH - CARD_WIDTH) / 2;
        const x = Math.max(AXIS_WIDTH + 8, baseX + (Number(p.xOffset) || 0));
        const y = (slotTop[p._slotKey] ?? HEADER_HEIGHT) + 20 + idxInGroup * (CARD_HEIGHT + CARD_GAP_Y);

        positions[p.id] = { x, y, w: CARD_WIDTH, h: CARD_HEIGHT };
      });

      // Collision-resolution pass so dragged or adjacent cards never overlap
      const ordered = [...visiblePapers].sort((a, b) => {
        const pa = positions[a.id], pb = positions[b.id];
        return pa.y !== pb.y ? pa.y - pb.y : pa.x - pb.x;
      });
      const placed = [];
      ordered.forEach(p => {
        const pos = positions[p.id];
        let guard = 0;
        while (guard < 30) {
          const hit = placed.find(q =>
            Math.abs(pos.x - q.x) < CARD_WIDTH + CARD_GAP_X &&
            Math.abs(pos.y - q.y) < CARD_HEIGHT + CARD_GAP_Y
          );
          if (!hit) break;
          pos.x = hit.x + CARD_WIDTH + CARD_GAP_X;
          guard++;
        }
        placed.push(pos);
      });

      let maxRight = AXIS_WIDTH + state.themes.length * LANE_WIDTH + 40;
      let maxBottom = currentY + 40;
      Object.values(positions).forEach(pos => {
        if (pos.x + pos.w + 32 > maxRight) maxRight = pos.x + pos.w + 32;
        if (pos.y + pos.h + 32 > maxBottom) maxBottom = pos.y + pos.h + 32;
      });

      const totalWidth = Math.max(maxRight, 820);
      const totalHeight = Math.max(maxBottom, 520);

      return { dateSlots, slotTop, positions, totalWidth, totalHeight };
    }

    // =========================================================================
    // Rendering: 2D Citation Map
    // =========================================================================
    function renderMap() {
      const container = document.getElementById('mapZoomContainer');
      document.getElementById('btnEmptyAddPaper')?.addEventListener('click', () => openPaperModal(null));
      document.getElementById('btnEmptyPaperpile')?.addEventListener('click', openPaperpileModal);
      const { visiblePapers, matchingLinks } = getFilteredData();
      const { dateSlots, slotTop, positions, totalWidth, totalHeight } = computeLayout(visiblePapers);

      document.getElementById('statsSummary').textContent =
        `表示中: 論文 ${visiblePapers.length}件 ／ 引用関係 ${matchingLinks.length}本`;

      container.style.width = `${totalWidth}px`;
      container.style.height = `${totalHeight}px`;
      container.style.transform = `scale(${state.zoom})`;
      document.getElementById('zoomLabel').textContent = `${Math.round(state.zoom * 100)}%`;

      // Build HTML for canvas
      let html = `<div class="relative bg-white rounded-xl border-2 border-slate-800 shadow-sm overflow-hidden" style="width:${totalWidth}px;height:${totalHeight}px;">`;

      // 1. Sticky Top-Left Corner Cell
      html += `<div id="stickyCorner" class="absolute top-0 left-0 border-r border-b border-slate-200 bg-slate-100/95 backdrop-blur flex items-center justify-center text-xs font-bold text-slate-600 z-40 pointer-events-none" style="width:${AXIS_WIDTH}px;height:${HEADER_HEIGHT}px;">出版年月日</div>`;

      // 1b. Sticky Horizontal Theme Lane Headers
      html += `<div id="stickyThemeBar" class="absolute top-0 left-0 right-0 flex border-b border-slate-200 bg-slate-50/95 backdrop-blur z-30 shadow-xs" style="height:${HEADER_HEIGHT}px;padding-left:${AXIS_WIDTH}px;">`;
      state.themes.forEach((t, idx) => {
        const count = visiblePapers.filter(p => p.themeId === t.id).length;
        html += `
          <div class="shrink-0 px-3 flex items-center justify-between border-r border-slate-200/80" style="width:${LANE_WIDTH}px;">
            <div class="flex items-center gap-2 min-w-0">
              <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${escapeHtml(t.color)}"></span>
              <span class="text-xs font-bold text-slate-800 truncate" title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</span>
            </div>
            <span class="text-[11px] font-semibold text-slate-500 bg-white border border-slate-200 rounded-full px-2 py-0.5 shrink-0">${count}</span>
          </div>`;
      });
      html += `</div>`;

      // Vertical lane background stripes
      state.themes.forEach((t, idx) => {
        const left = AXIS_WIDTH + idx * LANE_WIDTH;
        const stripe = idx % 2 === 1 ? 'bg-slate-50/40' : 'bg-white';
        html += `<div class="absolute bottom-0 border-r border-dashed border-slate-200/80 ${stripe} pointer-events-none" style="left:${left}px;width:${LANE_WIDTH}px;top:${HEADER_HEIGHT}px;"></div>`;
      });

      // 2. Horizontal Dashed Guide Lines across full canvas
      dateSlots.forEach((slot) => {
        const lineY = (slotTop[slot.key] ?? HEADER_HEIGHT) + 12;
        html += `
          <div class="absolute pointer-events-none z-10" style="top:${lineY}px;left:${AXIS_WIDTH}px;width:${totalWidth - AXIS_WIDTH}px;border-top:2px dashed #94a3b8;opacity:0.5;"></div>`;
      });

      // 2b. Sticky Left Date Axis Column (YYYY-MM-DD)
      html += `<div id="stickyDateAxis" class="absolute top-0 left-0 bottom-0 bg-white/95 backdrop-blur border-r border-slate-200 pointer-events-none z-25" style="width:${AXIS_WIDTH}px;z-index:25;">`;
      dateSlots.forEach((slot) => {
        const lineY = (slotTop[slot.key] ?? HEADER_HEIGHT) + 12;
        html += `<div class="absolute left-0 right-0 text-right pr-2.5 text-[11px] font-bold text-slate-700 font-mono leading-none" style="top:${lineY - 6}px;">${escapeHtml(slot.label)}</div>`;
      });
      html += `</div>`;

      // 3. SVG Layer for Curved Citation Edges
      html += `<svg class="absolute inset-0 z-10" width="${totalWidth}" height="${totalHeight}" style="overflow:visible;">
        <defs>
          ${Object.entries(INTENT_META).map(([k, m]) => `
            <marker id="arrow-${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1 L 10 5 L 0 9 z" fill="${m.color}" />
            </marker>
          `).join('')}
        </defs>`;

      const quotePills = [];

      // Pre-calculate port offsets so multiple edges from/to the same card don't overlap
      const outEdgesByPaper = {};
      const inEdgesByPaper = {};
      matchingLinks.forEach(lnk => {
        if (!positions[lnk.sourceId] || !positions[lnk.targetId]) return;
        (outEdgesByPaper[lnk.sourceId] = outEdgesByPaper[lnk.sourceId] || []).push(lnk);
        (inEdgesByPaper[lnk.targetId] = inEdgesByPaper[lnk.targetId] || []).push(lnk);
      });
      Object.values(outEdgesByPaper).forEach(arr => arr.sort((a, b) => (positions[a.targetId].x - positions[b.targetId].x)));
      Object.values(inEdgesByPaper).forEach(arr => arr.sort((a, b) => (positions[a.sourceId].x - positions[b.sourceId].x)));

      matchingLinks.forEach(lnk => {
        const srcPos = positions[lnk.sourceId];
        const tgtPos = positions[lnk.targetId];
        if (!srcPos || !tgtPos) return;

        const meta = INTENT_META[lnk.intent] || INTENT_META.background;
        const isSelected = state.selectedLinkId === lnk.id;
        const isConnectedToSelectedPaper =
          state.selectedPaperId && (lnk.sourceId === state.selectedPaperId || lnk.targetId === state.selectedPaperId);

        if (state.focusMode && state.selectedPaperId && !isConnectedToSelectedPaper) {
          return;
        }

        const outArr = outEdgesByPaper[lnk.sourceId] || [lnk];
        const outIdx = outArr.indexOf(lnk);
        const outSpread = outArr.length > 1 ? ((outIdx / (outArr.length - 1)) - 0.5) * Math.min(110, outArr.length * 22) : 0;

        const inArr = inEdgesByPaper[lnk.targetId] || [lnk];
        const inIdx = inArr.indexOf(lnk);
        const inSpread = inArr.length > 1 ? ((inIdx / (inArr.length - 1)) - 0.5) * Math.min(110, inArr.length * 22) : 0;

        // Start from bottom of older/cited paper, end at top of newer/citing paper
        const startX = srcPos.x + srcPos.w / 2 + outSpread;
        const startY = srcPos.y + srcPos.h;
        const endX = tgtPos.x + tgtPos.w / 2 + inSpread;
        const endY = tgtPos.y;

        const dy = Math.max(42, Math.abs(endY - startY) * 0.52);
        const c1x = startX;
        const c1y = startY + dy;
        const c2x = endX;
        const c2y = endY - dy;

        const pathD = `M ${startX} ${startY} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${endX} ${endY}`;
        const strokeWidth = isSelected ? 3.8 : (isConnectedToSelectedPaper ? 3.0 : 2.0);
        const opacity = (state.selectedPaperId || state.selectedLinkId)
          ? (isSelected || isConnectedToSelectedPaper ? 0.96 : 0.16)
          : 0.78;

        // Midpoint of cubic bezier at t=0.5
        const midX = 0.125 * startX + 0.375 * c1x + 0.375 * c2x + 0.125 * endX;
        const midY = 0.125 * startY + 0.375 * c1y + 0.375 * c2y + 0.125 * endY;

        html += `
          <path d="${pathD}" fill="none" stroke="transparent" stroke-width="14" class="cursor-pointer" data-link-id="${lnk.id}" />
          <path d="${pathD}" fill="none" stroke="${meta.color}" stroke-width="${strokeWidth}" stroke-opacity="${opacity}" marker-end="url(#arrow-${lnk.intent || 'background'})" class="edge-path" data-link-id="${lnk.id}" data-src-id="${lnk.sourceId}" data-tgt-id="${lnk.targetId}" />
          <circle cx="${startX}" cy="${startY}" r="${isConnectedToSelectedPaper || isSelected ? 3.8 : 2.8}" fill="${meta.color}" fill-opacity="${opacity}" class="pointer-events-none" />
        `;

        if (state.showQuotePills && (opacity > 0.3)) {
          quotePills.push({ id: lnk.id, x: midX, y: midY, color: meta.color, isSelected, quote: lnk.quote });
        }
      });

      html += `</svg>`;

      // 4. Quote Pill Buttons on Edges
      quotePills.forEach(pill => {
        const ring = pill.isSelected ? 'ring-2 ring-slate-900 scale-110' : '';
        html += `
          <button type="button" data-link-id="${pill.id}" title="${escapeHtml(pill.quote || '引用文言を見る')}"
            class="absolute -translate-x-1/2 -translate-y-1/2 z-20 w-6 h-6 rounded-full bg-white border-2 shadow-sm hover:scale-110 transition flex items-center justify-center text-[11px] ${ring}"
            style="left:${pill.x}px;top:${pill.y}px;border-color:${pill.color};">
            💬
          </button>`;
      });

      function getCitationTierStyle(citations) {
        const c = Number(citations || 0);
        if (c >= 3000) return { border: 'border-rose-500', ring: 'ring-rose-200/80', badge: 'text-rose-800 bg-rose-100/90' };
        if (c >= 2000) return { border: 'border-amber-500', ring: 'ring-amber-200/80', badge: 'text-amber-800 bg-amber-100/90' };
        if (c >= 1000) return { border: 'border-emerald-500', ring: 'ring-emerald-200/80', badge: 'text-emerald-800 bg-emerald-100/90' };
        if (c >= 100)  return { border: 'border-sky-500', ring: 'ring-sky-200/80', badge: 'text-sky-800 bg-sky-100/90' };
        return { border: 'border-slate-400', ring: 'ring-slate-200/80', badge: 'text-slate-700 bg-slate-200/80' };
      }

      // 5. Paper Nodes (Border color reflects citation count tier)
      visiblePapers.forEach(p => {
        const pos = positions[p.id];
        const isSelected = state.selectedPaperId === p.id;
        const inCount = state.links.filter(l => l.sourceId === p.id).length;
        const outCount = state.links.filter(l => l.targetId === p.id).length;
        const tier = getCitationTierStyle(p.citations);

        let relationBadge = '';
        let dimClass = '';
        if (state.selectedPaperId && !isSelected) {
          const isCitedBySel = state.links.some(l => l.sourceId === p.id && l.targetId === state.selectedPaperId);
          const citesSel = state.links.some(l => l.targetId === p.id && l.sourceId === state.selectedPaperId);
          if (isCitedBySel && citesSel) {
            relationBadge = `<span class="absolute -top-2.5 right-2 px-1.5 py-0.5 text-[9px] font-bold bg-indigo-600 text-white rounded-full shadow-xs">相互引用</span>`;
          } else if (isCitedBySel) {
            relationBadge = `<span class="absolute -top-2.5 right-2 px-1.5 py-0.5 text-[9px] font-bold bg-sky-600 text-white rounded-full shadow-xs">↑ 選択論文が引用</span>`;
          } else if (citesSel) {
            relationBadge = `<span class="absolute -top-2.5 right-2 px-1.5 py-0.5 text-[9px] font-bold bg-amber-600 text-white rounded-full shadow-xs">↓ 選択論文を引用</span>`;
          } else {
            dimClass = state.focusMode ? 'opacity-20' : 'opacity-55';
          }
        }

        const borderClass = isSelected
          ? `border-[3.5px] ${tier.border} ring-4 ${tier.ring} bg-white shadow-md`
          : `border-[2.5px] ${tier.border} bg-slate-100/95 hover:bg-white ${dimClass}`;

        html += `
          <div data-paper-id="${p.id}"
            class="paper-card absolute rounded-lg ${borderClass} px-3 py-2 cursor-pointer flex flex-col justify-between z-20 shadow-sm"
            style="left:${pos.x}px;top:${pos.y}px;width:${pos.w}px;height:${pos.h}px;">
            ${relationBadge}
            <div>
              <div class="text-[11px] font-bold text-slate-900 leading-snug line-clamp-2" title="${escapeHtml(p.title)}">
                ${escapeHtml(p.title)}
              </div>
              <div class="text-[11px] text-slate-600 truncate mt-0.5">
                ${escapeHtml(p.shortAuthor || p.authors)} (${escapeHtml(getPubDateDisplay(p))})
              </div>
            </div>
            <div class="flex items-center justify-between gap-1 pt-1 border-t border-slate-200/80 text-[10px]">
              <div class="flex items-center gap-1 min-w-0">
                <span class="inline-flex items-center font-bold ${tier.badge} px-1.5 py-0.5 rounded shrink-0">
                  引用 ${Number(p.citations || 0).toLocaleString()}
                </span>
                ${p.marks?.read ? `<span title="読了" class="inline-flex items-center px-1 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold">✅</span>` : ''}
                ${p.marks?.important ? `<span title="大事" class="inline-flex items-center px-1 py-0.5 rounded bg-amber-100 text-amber-800 font-bold">★</span>` : ''}
                ${p.marks?.review ? `<span title="要確認" class="inline-flex items-center px-1 py-0.5 rounded bg-sky-100 text-sky-800 font-bold">📌</span>` : ''}
              </div>
              <span class="text-slate-500 font-medium shrink-0">
                被 ${inCount} · 参 ${outCount}
              </span>
            </div>
          </div>`;
      });

      if (visiblePapers.length === 0) {
        const isCompletelyEmpty = state.papers.length === 0;
        html += `
          <div class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 z-20 p-6 text-center">
            <div class="bg-white/95 border border-slate-200 rounded-2xl p-6 shadow-sm max-w-md space-y-3">
              <p class="text-sm font-bold text-slate-800">${isCompletelyEmpty ? 'まだ論文が登録されていません' : '該当する論文がありません'}</p>
              <p class="text-xs text-slate-500 leading-relaxed">
                ${isCompletelyEmpty
                  ? '「+ 論文を追加」から1件ずつ登録するか、「Paperpile取込」からBibTeX / JSONを一括インポートしてマップを作成できます。'
                  : '検索条件やフィルターを変更してください。'}
              </p>
              ${isCompletelyEmpty ? `
                <div class="flex flex-wrap items-center justify-center gap-2 pt-1">
                  <button type="button" id="btnEmptyAddPaper" class="px-3.5 py-2 text-xs font-semibold bg-amber-400 hover:bg-amber-500 text-slate-900 rounded-lg shadow-xs transition">+ 論文を追加</button>
                  <button type="button" id="btnEmptyPaperpile" class="px-3.5 py-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shadow-xs transition">Paperpileから一括取込</button>
                </div>` : ''}
            </div>
          </div>`;
      }

      html += `</div>`;
      container.innerHTML = html;

      // Attach click & drag listeners
      attachCanvasListeners();
      updateStickyAxes();
    }

    function updateStickyAxes() {
      const vp = document.getElementById('mapViewport');
      if (!vp) return;
      const dx = Math.max(0, (vp.scrollLeft - 16) / state.zoom);
      const dy = Math.max(0, (vp.scrollTop - 16) / state.zoom);
      const bar = document.getElementById('stickyThemeBar');
      const axis = document.getElementById('stickyDateAxis');
      const corner = document.getElementById('stickyCorner');
      if (bar) bar.style.transform = `translateY(${dy}px)`;
      if (axis) axis.style.transform = `translateX(${dx}px)`;
      if (corner) corner.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    function attachCanvasListeners() {
      const container = document.getElementById('mapZoomContainer');

      // Edge clicks
      container.querySelectorAll('[data-link-id]').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          state.selectedLinkId = el.getAttribute('data-link-id');
          state.selectedPaperId = null;
          renderMap();
          renderInspector();
        });
      });

      // Paper clicks + horizontal drag
      container.querySelectorAll('[data-paper-id]').forEach(card => {
        let startX = 0;
        let origOffset = 0;
        let moved = false;

        card.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          const paperId = card.getAttribute('data-paper-id');
          const paper = state.papers.find(p => p.id === paperId);
          if (!paper) return;

          startX = e.clientX;
          origOffset = Number(paper.xOffset) || 0;
          moved = false;

          const onMove = (ev) => {
            const dx = (ev.clientX - startX) / state.zoom;
            if (Math.abs(dx) > 4) moved = true;
            if (moved) {
              paper.xOffset = Math.round(origOffset + dx);
              renderMap();
            }
          };

          const onUp = () => {
            window.removeEventListener('mousemove', onMove);
            window.removeEventListener('mouseup', onUp);
            if (moved) {
              // Check if dragged into another theme lane
              const rect = card.getBoundingClientRect();
              const vpRect = document.getElementById('mapViewport').getBoundingClientRect();
              const scrollLeft = document.getElementById('mapViewport').scrollLeft;
              const centerX = (rect.left - vpRect.left + scrollLeft + rect.width / 2) / state.zoom;
              const laneIdx = Math.floor((centerX - AXIS_WIDTH) / LANE_WIDTH);
              if (laneIdx >= 0 && laneIdx < state.themes.length && state.themes[laneIdx].id !== paper.themeId) {
                paper.themeId = state.themes[laneIdx].id;
                paper.xOffset = 0;
                showToast(`「${state.themes[laneIdx].name}」へ移動しました`);
              }
              saveState();
              renderMap();
              renderInspector();
            } else {
              state.selectedPaperId = paperId;
              state.selectedLinkId = null;
              renderMap();
              renderInspector();
            }
          };

          window.addEventListener('mousemove', onMove);
          window.addEventListener('mouseup', onUp);
        });
      });

      document.getElementById('modalBody').innerHTML = bodyHtml;

      bd.classList.remove('hidden');
      bd.classList.add('flex');
    }

    function closeModal() {
      const bd = document.getElementById('modalBackdrop');
      bd.classList.add('hidden');
      bd.classList.remove('flex');
    }

      document.getElementById('btnCancelPaper').addEventListener('click', closeModal);

      // OpenAlex live search handler
      document.getElementById('btnOaSearch')?.addEventListener('click', async () => {
        const q = document.getElementById('oaQuery').value.trim();
        const resBox = document.getElementById('oaResults');
        if (!q) return;
        resBox.innerHTML = `<div class="text-xs text-slate-500 py-1">OpenAlexを検索中...</div>`;
        try {
          const resp = await fetch(`https://api.openalex.org/works?search=${encodeURIComponent(q)}&per-page=5`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          const works = data.results || [];
          if (works.length === 0) {
            resBox.innerHTML = `<div class="text-xs text-slate-500 py-1">見つかりませんでした。手動で入力してください。</div>`;
            return;
          }
          resBox.innerHTML = works.map((w, i) => {
            const firstAuthor = w.authorships?.[0]?.author?.display_name || 'Unknown';
            const shortA = w.authorships?.length > 1 ? `${firstAuthor} et al.` : firstAuthor;
            return `
              <button type="button" data-oa-idx="${i}" class="w-full text-left p-2 rounded-lg bg-white border border-slate-200 hover:border-amber-400 text-xs transition">
                <div class="font-bold text-slate-800 line-clamp-1">${escapeHtml(w.title)}</div>
                <div class="text-[11px] text-slate-500">${escapeHtml(shortA)} (${w.publication_year || ''}) · 引用 ${w.cited_by_count ?? 0}</div>
              </button>`;
          }).join('');

          resBox.querySelectorAll('[data-oa-idx]').forEach(btn => {
            btn.addEventListener('click', () => {
              const w = works[Number(btn.getAttribute('data-oa-idx'))];
              const authorsList = (w.authorships || []).map(a => a.author?.display_name).filter(Boolean);
              const firstA = authorsList[0] || '';
              document.getElementById('fTitle').value = w.title || '';
              document.getElementById('fAuthors').value = authorsList.join(', ');
              document.getElementById('fShortAuthor').value = authorsList.length > 1 ? `${firstA} et al.` : firstA;
              document.getElementById('fYear').value = w.publication_year || 2024;
              document.getElementById('fPubDate').value = w.publication_date || String(w.publication_year || 2024);
              document.getElementById('fCitations').value = w.cited_by_count ?? 0;
              document.getElementById('fJournal').value = w.primary_location?.source?.display_name || '';
              document.getElementById('fDoi').value = (w.doi || '').replace('https://doi.org/', '');
              const absText = reconstructAbstract(w.abstract_inverted_index);
              if (absText && !document.getElementById('fSummaryEn').value) {
                document.getElementById('fSummaryEn').value = absText;
              }
              const suggestedTheme = autoAssignThemeForPaper({
                title: w.title || '',
                oaTopics: (w.topics || []).map(t => t.display_name),
                oaConcepts: (w.concepts || []).map(c => c.display_name)
              }, document.getElementById('fTheme').value);
              if (suggestedTheme) document.getElementById('fTheme').value = suggestedTheme;
              showToast('OpenAlexから書誌情報と推奨テーマを入力しました');
            });
          });
        } catch (err) {
          resBox.innerHTML = `<div class="text-xs text-rose-600 py-1">OpenAlexへの接続に失敗しました (${escapeHtml(err.message)})。手動入力をご利用ください。</div>`;
        }
      });

      document.getElementById('paperForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const payload = {
          id: existing ? existing.id : uid('paper'),
          title: document.getElementById('fTitle').value.trim(),
          shortAuthor: document.getElementById('fShortAuthor').value.trim(),
          authors: document.getElementById('fAuthors').value.trim(),
          pubDate: document.getElementById('fPubDate').value.trim() || String(document.getElementById('fYear').value),
          year: Number((document.getElementById('fPubDate').value.trim().match(/^(\d{4})/) || [])[1] || document.getElementById('fYear').value),
          themeId: document.getElementById('fTheme').value,
          citations: Number(document.getElementById('fCitations').value) || 0,
          journal: document.getElementById('fJournal').value.trim(),
          doi: document.getElementById('fDoi').value.trim(),
          paperpileUrl: document.getElementById('fPaperpileUrl').value.trim(),
          summary: document.getElementById('fSummary').value.trim(),
          summaryEn: document.getElementById('fSummaryEn').value.trim(),
          marks: existing?.marks || {},
          openAlexId: existing?.openAlexId || '',
          oaTopics: existing?.oaTopics || [],
          oaConcepts: existing?.oaConcepts || [],
          xOffset: existing ? existing.xOffset : 0
        };
        if (isEdit) {
          const idx = state.papers.findIndex(x => x.id === existing.id);
          if (idx >= 0) state.papers[idx] = payload;
        } else {
          state.papers.push(payload);
        }
        state.selectedPaperId = payload.id;
        state.selectedLinkId = null;
        saveState();
        closeModal();
        renderMap();
        renderInspector();
        showToast(isEdit ? '論文情報を更新しました' : '論文を追加しました');
      });
    }

    // =========================================================================

    function openLinkModal(existing = null, defaults = {}) {
      if (state.papers.length < 2) {
        showToast('引用線を引くには2件以上の論文が必要です');
        return;
      }
      const isEdit = !!existing;
      const sortedPapers = [...state.papers].sort((a, b) => a.year - b.year);
      const srcDefault = existing?.sourceId || defaults.sourceId || sortedPapers[0].id;
      const tgtDefault = existing?.targetId || defaults.targetId || sortedPapers[sortedPapers.length - 1].id;

      const makeOpts = (selId) => sortedPapers.map(p =>
        `<option value="${p.id}" ${p.id === selId ? 'selected' : ''}>[${p.year}] ${escapeHtml(p.shortAuthor)} — ${escapeHtml(p.title.slice(0, 42))}</option>`
      ).join('');

      openModal(isEdit ? '引用関係・文言を編集' : '引用関係と引用文言を追加', `
        <form id="linkForm" class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">被引用先（古い論文・引用される側）*</label>
            <select id="lSource" class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-lg bg-white">${makeOpts(srcDefault)}</select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">引用元（新しい論文・引用する側）*</label>
            <select id="lTarget" class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-lg bg-white">${makeOpts(tgtDefault)}</select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">引用の文脈タイプ *</label>
              <select id="lIntent" class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-lg bg-white">
                ${Object.entries(INTENT_META).map(([k, m]) =>
                  `<option value="${k}" ${(existing?.intent || 'background') === k ? 'selected' : ''}>${m.label}</option>`
                ).join('')}
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">引用箇所のセクション</label>
              <input id="lSection" type="text" placeholder="例: Introduction / Methods" value="${escapeHtml(existing?.section || '')}" class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-lg" />
            </div>
          </div>
          <details class="p-2.5 rounded-xl bg-indigo-50/60 border border-indigo-200 text-xs">
            <summary class="cursor-pointer font-bold text-indigo-900 select-none">本文テキストから「[1]」等の直前を精密抽出する</summary>
            <div class="mt-2 space-y-2">
              <div class="flex items-center gap-2">
                <input id="extMarker" type="text" placeholder="文献番号 (例: 14) または 著者名" class="flex-1 px-2.5 py-1 text-xs bg-white border border-indigo-200 rounded-lg" />
                <button type="button" id="btnRunExtract" class="px-3 py-1 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg shrink-0">直前の文を抽出</button>
              </div>
              <textarea id="extBodyText" rows="3" placeholder="論文PDFから引用を含む段落をそのまま貼り付けてください..." class="w-full p-2 text-[11px] bg-white border border-indigo-200 rounded-lg font-serif"></textarea>
            </div>
          </details>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">本文中の引用文言（英語原文）*</label>
            <textarea id="lQuote" rows="2" required placeholder="論文本文中の引用箇所をそのまま入力..." class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-lg font-serif">${escapeHtml(existing?.quote || '')}</textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">本文中の引用文言（日本語訳）</label>
            <textarea id="lQuoteJa" rows="2" placeholder="日本語訳（任意）を入力すると英語/日本語を切り替えられます..." class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-lg">${escapeHtml(existing?.quoteJa || '')}</textarea>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">補足メモ（なぜ・どう引用されているか）</label>
            <textarea id="lNote" rows="2" placeholder="自分の研究との関係やポイントなど..." class="w-full px-3 py-1.5 text-xs border border-slate-300 rounded-lg">${escapeHtml(existing?.note || '')}</textarea>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" id="btnCancelLink" class="px-4 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 rounded-lg">キャンセル</button>
            <button type="submit" class="px-4 py-1.5 text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-white rounded-lg">${isEdit ? '更新する' : '追加する'}</button>

      document.getElementById('btnRunExtract')?.addEventListener('click', () => {
        const bodyTxt = document.getElementById('extBodyText').value;
        const marker = document.getElementById('extMarker').value.trim();
        const citedP = state.papers.find(x => x.id === document.getElementById('lSource').value);
        const surname = (citedP?.shortAuthor || citedP?.authors || '').split(/[\s,]+/)[0] || '';
        const isNum = /^\[?\d+\]?$/.test(marker);
        const extracted = extractCitationSentence(bodyTxt, {
          refNum: isNum ? marker : '',
          authorSurname: isNum ? surname : (marker || surname),
          year: citedP?.year || ''
        });
        if (extracted) {
          document.getElementById('lQuote').value = extracted;
          showToast('引用マーカー直前の文を抽出しました');
        } else {
          showToast('該当する文を抽出できませんでした');
        }
      });
      document.getElementById('btnCancelLink').addEventListener('click', closeModal);
      document.getElementById('linkForm').addEventListener('submit', (e) => {

          return;

        const payload = {
          id: existing ? existing.id : uid('lnk'),
          sourceId,
          targetId,
          intent: document.getElementById('lIntent').value,
          section: document.getElementById('lSection').value.trim(),
          quote: document.getElementById('lQuote').value.trim(),
          quoteJa: document.getElementById('lQuoteJa').value.trim(),
          note: document.getElementById('lNote').value.trim()
        };
        if (isEdit) {
          const idx = state.links.findIndex(x => x.id === existing.id);
          if (idx >= 0) state.links[idx] = payload;
        } else {
          state.links.push(payload);
        }
        state.selectedLinkId = payload.id;
        state.selectedPaperId = null;
        saveState();
        closeModal();
        renderMap();
        renderInspector();
        showToast(isEdit ? '引用関係を更新しました' : '引用線を追加しました');
      });
    }

    // =========================================================================
    // Modals: Theme Manager & JSON Import/Export
    // =========================================================================
    function openThemesModal() {
      const renderRows = () => state.themes.map((t, idx) => `
        <div class="flex items-center gap-2">
          <input type="color" value="${escapeHtml(t.color)}" data-tcolor="${idx}" class="w-8 h-8 rounded cursor-pointer border border-slate-200" />
          <input type="text" value="${escapeHtml(t.name)}" data-tname="${idx}" class="flex-1 px-3 py-1.5 text-xs border border-slate-300 rounded-lg" />
          ${state.themes.length > 1 ? `<button type="button" data-tdel="${idx}" class="px-2.5 py-1.5 text-xs bg-rose-50 text-rose-700 rounded-lg hover:bg-rose-100">削除</button>` : ''}
        </div>
      `).join('');

      openModal('横軸（分野・テーマレーン）の設定', `
        <div id="themeRows" class="space-y-2">${renderRows()}</div>
        <div class="flex items-center justify-between pt-3 border-t border-slate-200">
          <button id="btnAddThemeRow" type="button" class="px-3 py-1.5 text-xs font-semibold bg-slate-100 hover:bg-slate-200 rounded-lg">+ テーマを追加</button>
          <button id="btnSaveThemes" type="button" class="px-4 py-1.5 text-xs font-semibold bg-amber-400 hover:bg-amber-500 text-slate-900 rounded-lg">保存する</button>
        </div>
      `);

      const bindThemeActions = () => {
        document.querySelectorAll('[data-tdel]').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.getAttribute('data-tdel'));
            const removedId = state.themes[idx].id;
            state.themes.splice(idx, 1);
            const fallbackId = state.themes[0].id;
            state.papers.forEach(p => { if (p.themeId === removedId) p.themeId = fallbackId; });
            document.getElementById('themeRows').innerHTML = renderRows();
            bindThemeActions();
          });
        });
      };
      bindThemeActions();

      document.getElementById('btnAddThemeRow').addEventListener('click', () => {
        state.themes.push({ id: uid('theme'), name: '新しいテーマ', color: '#8b5cf6' });
        document.getElementById('themeRows').innerHTML = renderRows();
        bindThemeActions();
      });

      document.getElementById('btnSaveThemes').addEventListener('click', () => {
        document.querySelectorAll('[data-tname]').forEach(inp => {
          const i = Number(inp.getAttribute('data-tname'));
          if (state.themes[i]) state.themes[i].name = inp.value.trim() || `テーマ ${i + 1}`;
        });
        document.querySelectorAll('[data-tcolor]').forEach(inp => {
          const i = Number(inp.getAttribute('data-tcolor'));
          if (state.themes[i]) state.themes[i].color = inp.value;
        });
        saveState();
        closeModal();
        renderMap();
        renderInspector();
        showToast('テーマ設定を保存しました');
      });
    }

    function openDataIOModal() {

    // =========================================================================
    // Paperpile (BibTeX / JSON) Parsers & Import Modal
    // =========================================================================
    function cleanBibValue(val) {
      return (val || '')
        .replace(/\s+/g, ' ')
        .replace(/[{}]/g, '')
        .trim();
    }

    function makeShortAuthor(authorsStr) {
      if (!authorsStr) return 'Unknown';
      const parts = authorsStr.split(/\s+and\s+|\s*,\s*(?=[A-Z])/i).map(x => x.trim()).filter(Boolean);
      const first = parts[0] || authorsStr;
      // If "Last, First" format, take Last
      const last = first.includes(',') ? first.split(',')[0].trim() : first.split(/\s+/).pop();
      return parts.length > 1 ? `${last} et al.` : last;
    }

    function parseBibTeX(text) {
      const entries = [];
      let i = 0;
      const len = text.length;
      while (i < len) {
        const atIdx = text.indexOf('@', i);
        if (atIdx === -1) break;
        const braceIdx = text.indexOf('{', atIdx);
        if (braceIdx === -1) break;
        const entryType = text.slice(atIdx + 1, braceIdx).trim().toLowerCase();
        if (entryType === 'comment' || entryType === 'preamble' || entryType === 'string') {
          i = braceIdx + 1;
          continue;
        }
        // Find matching closing brace
        let depth = 1;
        let j = braceIdx + 1;
        while (j < len && depth > 0) {
          if (text[j] === '{') depth++;
          else if (text[j] === '}') depth--;
          j++;
        }
        const body = text.slice(braceIdx + 1, j - 1);
        i = j;

        const firstComma = body.indexOf(',');
        if (firstComma === -1) continue;
        const fieldsStr = body.slice(firstComma + 1);

        // Parse key = value pairs
        const fields = {};
        let k = 0;
        while (k < fieldsStr.length) {
          while (k < fieldsStr.length && /[\s,]/.test(fieldsStr[k])) k++;
          if (k >= fieldsStr.length) break;
          const eqIdx = fieldsStr.indexOf('=', k);
          if (eqIdx === -1) break;
          const key = fieldsStr.slice(k, eqIdx).trim().toLowerCase();
          k = eqIdx + 1;
          while (k < fieldsStr.length && /\s/.test(fieldsStr[k])) k++;
          let val = '';
          if (fieldsStr[k] === '{') {
            let d = 1;
            k++;
            const start = k;
            while (k < fieldsStr.length && d > 0) {
              if (fieldsStr[k] === '{') d++;
              else if (fieldsStr[k] === '}') d--;
              k++;
            }
            val = fieldsStr.slice(start, k - 1);
          } else if (fieldsStr[k] === '"') {
            k++;
            const start = k;
            while (k < fieldsStr.length && fieldsStr[k] !== '"') {
              if (fieldsStr[k] === '\\') k++;
              k++;
            }
            val = fieldsStr.slice(start, k);
            k++;
          } else {
            const start = k;
            while (k < fieldsStr.length && fieldsStr[k] !== ',') k++;
            val = fieldsStr.slice(start, k);
          }
          fields[key] = cleanBibValue(val);
        }

        if (!fields.title) continue;
        const rawAuthors = (fields.author || '').replace(/\s+and\s+/gi, ', ');
        const yearNum = parseInt(fields.year, 10) || new Date().getFullYear();
        const labelCandidate = (fields.keywords || '').split(/[,;]/)[0]?.trim() || '';

        entries.push({
          title: fields.title,
          authors: rawAuthors,
          shortAuthor: makeShortAuthor(fields.author || ''),
          year: yearNum,
          journal: fields.journal || fields.booktitle || '',
          doi: (fields.doi || '').replace(/^https?:\/\/doi\.org\//i, ''),
          summary: '',
          summaryEn: fields.abstract || '',
          label: labelCandidate
        });
      }
      return entries;
    }

    function parsePaperpileJSON(text) {
      const data = JSON.parse(text);
      const arr = Array.isArray(data) ? data : (Array.isArray(data.items) ? data.items : []);
      return arr.filter(item => item && item.title).map(item => {
        const authorsArr = (item.author || []).map(a =>
          a.formatted || [a.first, a.last].filter(Boolean).join(' ')
        ).filter(Boolean);
        const firstLast = item.author?.[0]?.last || authorsArr[0] || 'Unknown';
        const shortAuthor = authorsArr.length > 1 ? `${firstLast} et al.` : firstLast;
        const yearNum = Number(item.published?.year || item.year) || new Date().getFullYear();
        const labelCandidate = (item.labelsNamed && item.labelsNamed[0]) || (item.foldersNamed && item.foldersNamed[0]) || '';

        return {
          title: item.title,
          authors: authorsArr.join(', '),
          shortAuthor,
          year: yearNum,
          journal: item.journal || item.journalfull || item.booktitle || '',
          doi: (item.doi || '').replace(/^https?:\/\/doi\.org\//i, ''),
          summary: '',
          summaryEn: item.abstract || '',
          label: labelCandidate
        };
      });
    }
