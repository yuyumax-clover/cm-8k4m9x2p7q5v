    // =========================================================================
    // Live OpenAlex Citation Count Refresh & Auto-Linking
    // =========================================================================
    function reconstructAbstract(invertedIndex) {
      if (!invertedIndex || typeof invertedIndex !== 'object') return '';
      const words = [];
      Object.entries(invertedIndex).forEach(([word, positions]) => {
        if (Array.isArray(positions)) {
          positions.forEach(pos => { words[pos] = word; });
        }
      });
      return words.filter(Boolean).join(' ');
    }

    async function fetchAbstractFallback(p) {
      if (p.summaryEn && p.summaryEn.trim()) return true;
      // 1. Try OpenAlex if not yet fetched
      if (p.doi && p.doi.trim()) {
        const cleanDoi = p.doi.trim().replace(/^https?:\/\/doi\.org\//i, '');
        try {
          const oaResp = await fetch(`https://api.openalex.org/works/https://doi.org/${encodeURIComponent(cleanDoi)}`);
          if (oaResp.ok) {
            const oa = await oaResp.json();
            const abs = reconstructAbstract(oa.abstract_inverted_index);
            if (abs) { p.summaryEn = abs; return true; }
          }
        } catch (e) {}
        // 2. Try Semantic Scholar (abstract + tldr)
        try {
          const s2Resp = await fetch(`https://api.semanticscholar.org/graph/v1/paper/DOI:${encodeURIComponent(cleanDoi)}?fields=abstract,tldr`);
          if (s2Resp.ok) {
            const s2 = await s2Resp.json();
            const abs = s2.abstract || s2.tldr?.text || '';
            if (abs) { p.summaryEn = abs; return true; }
          }
        } catch (e) {}
        // 3. Try Crossref abstract
        try {
          const crResp = await fetch(`https://api.crossref.org/works/${encodeURIComponent(cleanDoi)}`);
          if (crResp.ok) {
            const cr = await crResp.json();
            const rawAbs = cr.message?.abstract || '';
            const cleanAbs = rawAbs.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
            if (cleanAbs) { p.summaryEn = cleanAbs; return true; }
          }
        } catch (e) {}
      }
      return false;
    }

    async function syncWithOpenAlex({ autoLink = true } = {}) {
      if (state.papers.length === 0) {
        showToast('論文が登録されていません');
        return;
      }
      showToast('OpenAlexから引用数と引用関係を同期中...');
      let updated = 0;

      for (const p of state.papers) {
        try {
          let data = null;
          if (p.doi && p.doi.trim()) {
            const cleanDoi = p.doi.trim().replace(/^https?:\/\/doi\.org\//i, '');
            const resp = await fetch(`https://api.openalex.org/works/https://doi.org/${encodeURIComponent(cleanDoi)}`);
            if (resp.ok) data = await resp.json();
          } else if (p.title && p.title.trim()) {
            const resp = await fetch(`https://api.openalex.org/works?search=${encodeURIComponent(p.title)}&per-page=1`);
            if (resp.ok) {
              const resJson = await resp.json();
              data = resJson.results?.[0] || null;
            }
          }

          if (data) {
            if (typeof data.cited_by_count === 'number') {
              p.citations = data.cited_by_count;
            }
            if (data.publication_date) {
              p.pubDate = data.publication_date;
              p.year = Number(data.publication_year || data.publication_date.slice(0, 4)) || p.year;
            }
            if (data.id) p.openAlexId = data.id;
            if (Array.isArray(data.referenced_works)) {
              p._referencedWorks = data.referenced_works;
            }
            if (!p.doi && data.doi) {
              p.doi = data.doi.replace(/^https?:\/\/doi\.org\//i, '');
            }
            if (!p.summaryEn && data.abstract_inverted_index) {
              p.summaryEn = reconstructAbstract(data.abstract_inverted_index);
            }
            if (Array.isArray(data.topics) && data.topics.length > 0) {
              p.oaTopics = data.topics.slice(0, 4).map(t => t.display_name).filter(Boolean);
            }
            if (Array.isArray(data.concepts) && data.concepts.length > 0) {
              p.oaConcepts = data.concepts.slice(0, 5).map(c => c.display_name).filter(Boolean);
            }
            updated++;
          }
        } catch (e) {
          // Continue other papers
        }
      }

      let newLinks = 0;
      if (autoLink) {
        const oaToPaperId = {};
        state.papers.forEach(p => {
          if (p.openAlexId) oaToPaperId[p.openAlexId] = p.id;
        });

        state.papers.forEach(citingPaper => {
          const refs = citingPaper._referencedWorks || [];
          refs.forEach(refOaId => {
            const citedPaperId = oaToPaperId[refOaId];
            if (!citedPaperId || citedPaperId === citingPaper.id) return;
            const alreadyExists = state.links.some(l => l.sourceId === citedPaperId && l.targetId === citingPaper.id);
            if (!alreadyExists) {
              state.links.push({
                id: uid('lnk'),
                sourceId: citedPaperId,
                targetId: citingPaper.id,
                intent: 'background',
                section: 'References (OpenAlex自動検出)',
                quote: '',
                quoteJa: '',
                note: 'OpenAlexの参考文献リストから引用関係を自動検出しました。編集ボタンから本文中の引用文言を追記できます。'
              });
              newLinks++;
            }
          });
        });
      }

      let s2Filled = 0;
      if (autoLink) {
        const emptyLinks = state.links.filter(l => !(l.quote || '').trim());
        if (emptyLinks.length > 0) {
          s2Filled = await enrichLinksWithSemanticScholar(emptyLinks);
        }
      }

      if (updated > 0 || newLinks > 0 || s2Filled > 0) {
        saveState();
        renderMap();
        renderInspector();
        showToast(`同期完了: 引用数 ${updated}件更新 ／ 新規引用線 ${newLinks}本 ／ 引用文言 ${s2Filled}件取得`);
      } else {
        showToast('OpenAlexから新しい情報を取得できませんでした');
      }
    }

    function extractCitationSentence(rawText, { refNum = '', authorSurname = '', year = '' } = {}) {
      const text = (rawText || '').replace(/\s+/g, ' ').trim();
      if (!text) return '';

      // Protect common abbreviations before splitting sentences
      const protectedText = text
        .replace(/\b(et al|Fig|Figs|Eq|Eqs|Ref|Refs|Vol|No|pp|e\.g|i\.e|vs|Dr|Prof)\./gi, '$1__DOT__');

      // Split into sentences ending with . ! ? 。
      const rawSentences = protectedText
        .split(/(?<=[.!?。])\s+/)
        .map(x => x.replace(/__DOT__/g, '.').trim())
        .filter(Boolean);

      if (rawSentences.length === 0) return text;

      // 1. If user specified a reference number like "14" or "[14]"
      const numOnly = (refNum || '').replace(/[^0-9]/g, '');
      if (numOnly) {
        const bracketRegex = new RegExp(`\\[(?:[^\\]]*?\\b${numOnly}\\b[^\\]]*?)\\]`);
        const hit = rawSentences.find(sent => bracketRegex.test(sent));
        if (hit) {
          // Trim right after the matching bracket if there's trailing text in the same block
          const m = hit.match(bracketRegex);
          if (m) {
            const endIdx = m.index + m[0].length;
            return hit.slice(0, endIdx).trim();
          }
          return hit;
        }
      }

      // 2. Match author surname or (Author, Year)
      const cleanSurname = (authorSurname || '').replace(/[^a-zA-Z0-9\u3040-\u30ff\u4e00-\u9faf-]/g, '');
      if (cleanSurname.length >= 2) {
        const authorHit = rawSentences.find(sent =>
          sent.toLowerCase().includes(cleanSurname.toLowerCase())
        );
        if (authorHit) return authorHit;
      }

      // 3. Otherwise pick the sentence containing a bracketed citation [n] or (Author, YYYY)
      const anyCiteHit = rawSentences.find(sent =>
        /\[[0-9,\s–-]+\]/.test(sent) || /\([A-Z][a-zA-Z-]+.*?(?:19|20)\d{2}[a-z]?\)/.test(sent)
      );
      if (anyCiteHit) {
        const m = anyCiteHit.match(/(\[[0-9,\s–-]+\]|\([A-Z][a-zA-Z-]+.*?(?:19|20)\d{2}[a-z]?\))/);
        if (m) {
          const endIdx = m.index + m[0].length;
          return anyCiteHit.slice(0, endIdx).trim();
        }
        return anyCiteHit;
      }

      return rawSentences[0];
    }

    async function enrichLinksWithSemanticScholar(targetLinks) {
      if (!targetLinks || targetLinks.length === 0) return 0;
      // Group links by citing paper (targetId) so we make at most 1 S2 request per citing paper
      const byCiter = {};
      targetLinks.forEach(l => {
        if (!byCiter[l.targetId]) byCiter[l.targetId] = [];
        byCiter[l.targetId].push(l);
      });

      let filled = 0;
      const intentMap = { methodology: 'method', result: 'comparison', background: 'background' };

      for (const [citerId, links] of Object.entries(byCiter)) {
        const citer = state.papers.find(p => p.id === citerId);
        if (!citer) continue;
        try {
          let paperParam = '';
          if (citer.doi && citer.doi.trim()) {
            paperParam = `DOI:${encodeURIComponent(citer.doi.trim().replace(/^https?:\/\/doi\.org\//i, ''))}`;
          } else if (citer.title) {
            const sr = await fetch(`https://api.semanticscholar.org/graph/v1/paper/search?query=${encodeURIComponent(citer.title)}&fields=paperId&limit=1`);
            if (sr.ok) {
              const sj = await sr.json();
              if (sj.data?.[0]?.paperId) paperParam = sj.data[0].paperId;
            }
          }
          if (!paperParam) continue;

          const resp = await fetch(`https://api.semanticscholar.org/graph/v1/paper/${paperParam}/references?fields=contexts,intents,citedPaper.externalIds,citedPaper.title&limit=500`);
          if (!resp.ok) continue;
          const json = await resp.json();
          const refs = json.data || [];

          links.forEach(lnk => {
            const cited = state.papers.find(p => p.id === lnk.sourceId);
            if (!cited) return;
            const cDoi = (cited.doi || '').trim().replace(/^https?:\/\/doi\.org\//i, '').toLowerCase();
            const cTitle = (cited.title || '').trim().toLowerCase();

            const match = refs.find(r => {
              const cp = r.citedPaper;
              if (!cp) return false;
              const rDoi = (cp.externalIds?.DOI || '').toLowerCase();
              const rTitle = (cp.title || '').toLowerCase();
              return (cDoi && rDoi && cDoi === rDoi) || (cTitle && rTitle && (rTitle === cTitle || rTitle.includes(cTitle.slice(0, 40))));
            });

            if (match && Array.isArray(match.contexts) && match.contexts.length > 0) {
              const surname = (cited.shortAuthor || cited.authors || '').split(/[\s,]+/)[0] || '';
              const precise = match.contexts
                .map(ctx => extractCitationSentence(ctx, { authorSurname: surname, year: cited.year }))
                .filter(Boolean);
              lnk.quote = (precise.length > 0 ? precise : match.contexts).join(' / ');
              if (Array.isArray(match.intents) && match.intents[0] && intentMap[match.intents[0]]) {
                lnk.intent = intentMap[match.intents[0]];
              }
              if (lnk.section && lnk.section.includes('OpenAlex')) {
                lnk.section = 'Body Text (Semantic Scholar自動抽出)';
              }
              filled++;
            }
          });
        } catch (e) {
          // Gracefully ignore S2 rate limit or CORS errors for paywalled papers
        }
      }
      return filled;
    }

    // =========================================================================
    // Auto-Suggest & Classify Horizontal Axis (Themes)
    // =========================================================================
    function autoAssignThemeForPaper(paperObj, fallbackThemeId) {
      if (!state.themes || state.themes.length === 0) return fallbackThemeId || '';
      const text = [
        paperObj.title, paperObj.summary, paperObj.summaryEn, paperObj.journal,
        ...(paperObj.oaTopics || []), ...(paperObj.oaConcepts || [])
      ].filter(Boolean).join(' ').toLowerCase();

      const semanticGroups = [
        { themeHints: ['マイクロ波', '共振器', '回路', 'microwave', 'resonator', 'antenna'], keywords: ['microwave', 'resonator', 'antenna', 'coplanar', 'waveguide', 'cavity', 'stripline', 'hfss', 's11', 'rf ', 'ghZ', 'マイクロ波', '共振器'] },
        { themeHints: ['パルス', 'シーケンス', 'デカップリング', 'pulse', 'echo', 'ramsey'], keywords: ['pulse', 'echo', 'echoes', 'ramsey', 'rabi', 'cpmg', 'xy8', 'dynamical decoupling', 'nmr', 'coherent', 'nutation', 'gyrating', 'パルス', 'エコー'] },
        { themeHints: ['光学', '読み出し', 'レーザー', 'optical', 'laser', 'readout'], keywords: ['optical', 'confocal', 'fluorescence', 'photoconductivity', 'laser', 'electro-optics', 'luminescence', 'readout', 'odmr', 'zpl', 'phonon', '光学', '読み出し'] },
        { themeHints: ['材料', '表面', '欠陥', 'ダイヤモンド', 'material', 'surface', 'defect'], keywords: ['diamond', 'defect', 'implantation', 'anneal', 'surface', 'strain', 'isotopically', '13c', '12c', 'nanocrystal', 'cvd', '材料', '表面', '欠陥'] },
        { themeHints: ['単一', 'ナノ', 'single', 'nano'], keywords: ['single', 'individual', 'nanoscale', 'nanometre', 'scanning probe', 'afm', '単一', 'ナノ'] },
        { themeHints: ['アンサンブル', '広視野', '高感度', 'ensemble', 'widefield'], keywords: ['ensemble', 'widefield', 'femtotesla', 'broadband', 'bulk', 'high-sensitivity', 'アンサンブル', '広視野', '高感度'] },
        { themeHints: ['イメージング', '応用', '生体', '計測', 'imaging', 'sensing', 'app'], keywords: ['imaging', 'mapping', 'biological', 'cell', 'magnetometry', 'magnetometer', 'sensor', 'sensing', '応用', '計測'] },
        { themeHints: ['レビュー', '理論', '基礎', 'review', 'theory', 'foundation'], keywords: ['review', 'optimization', 'sensitivity', 'theoretical', 'framework', 'limit', 'quantal', 'phase factors', 'overview', 'survey', 'レビュー', '理論', '基礎'] }
      ];

      let bestId = fallbackThemeId || state.themes[0].id;
      let bestScore = 0;

      state.themes.forEach(t => {
        let score = 0;
        const tLower = (t.name || '').toLowerCase();
        const isNonDiamondLane = /以外|除く|^非/.test(tLower);
        const isDiamondPaper = /\bdiamond\b|nitrogen[- ]vacancy|\bnv\b|ダイヤモンド/.test(text);

        if (isNonDiamondLane && isDiamondPaper) {
          score -= 10;
        }
        if (!isNonDiamondLane && /nv|ダイヤモンド|diamond/.test(tLower) && isDiamondPaper) {
          score += 2;
        }

        // Match tokens from theme name directly (skipping negated prefixes like "ダイヤモンド以外")
        const cleanedTheme = tLower.replace(/[^・\/\s,()（）-]+(?:以外|を除く)/g, '');
        cleanedTheme.split(/[・\/\s,()（）-]+/).filter(w => w.length >= 2).forEach(tok => {
          if (text.includes(tok)) score += 3;
        });
        // Match semantic groups associated with this theme name
        semanticGroups.forEach(g => {
          if (g.themeHints.some(h => tLower.includes(h))) {
            g.keywords.forEach(kw => {
              if (text.includes(kw)) {
                score += (paperObj.title || '').toLowerCase().includes(kw) ? 2 : 1;
              }
            });
          }
        });
        if (score > bestScore) {
          bestScore = score;
          bestId = t.id;
        }
      });

      return bestId;
    }

    function buildClassificationProposal(mode) {
      const palette = ['#6366f1', '#0ea5e9', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#14b8a6'];
      const getSearchText = (p) => [
        p.title, p.summary, p.summaryEn, p.journal,
        ...(p.oaTopics || []), ...(p.oaConcepts || [])
      ].filter(Boolean).join(' ').toLowerCase();

      if (mode === 'openalex') {
        // Group by OpenAlex primary topic or fallback keyword extraction
        const groups = {};
        const stopwords = new Set(['with', 'from', 'using', 'based', 'single', 'diamond', 'center', 'centers', 'quantum', 'magnetic', 'field', 'fields', 'nitrogen', 'vacancy', 'under', 'room', 'temperature', 'high', 'study', 'analysis', 'review', 'nanoscale', 'sensing']);
        state.papers.forEach(p => {
          let label = (p.oaTopics && p.oaTopics[0]) || '';
          if (!label) {
            const words = (p.title || '').toLowerCase().replace(/[^a-z0-9\s-]/g, ' ').split(/\s+/)
              .filter(w => w.length >= 4 && !stopwords.has(w));
            label = words[0] ? words[0].charAt(0).toUpperCase() + words[0].slice(1) + ' 関連' : '一般・基礎';
          }
          if (!groups[label]) groups[label] = [];
          groups[label].push(p.id);
        });

        // Merge singleton groups if too many (> 6)
        const entries = Object.entries(groups).sort((a, b) => b[1].length - a[1].length);
        const finalThemes = [];
        const assignments = {};
        const maxBuckets = 5;
        entries.forEach(([name, ids], idx) => {
          if (idx < maxBuckets) {
            const tid = uid('theme');
            finalThemes.push({ id: tid, name, color: palette[idx % palette.length] });
            ids.forEach(pid => { assignments[pid] = tid; });
          } else {
            let otherTheme = finalThemes.find(t => t.name === 'その他・関連研究');
            if (!otherTheme) {
              otherTheme = { id: uid('theme'), name: 'その他・関連研究', color: palette[maxBuckets % palette.length] };
              finalThemes.push(otherTheme);
            }
            ids.forEach(pid => { assignments[pid] = otherTheme.id; });
          }
        });
        return { themes: finalThemes, assignments };
      }

      const ruleSets = {
        tech: [
          { name: 'レビュー・感度理論', color: '#f59e0b', keywords: ['review', 'optimization', 'sensitivity', 'limit', 'theoretical', 'framework', 'レビュー', '理論', '感度限界', '最適化'] },
          { name: 'マイクロ波・共振器・回路', color: '#ec4899', keywords: ['microwave', 'resonator', 'antenna', 'coplanar', 'waveguide', 'hfss', 'vna', 's11', 'rf ', 'マイクロ波', '共振器', 'アンテナ'] },
          { name: 'パルス制御・動的デカップリング', color: '#10b981', keywords: ['coherent', 'rabi', 'echo', 'ramsey', 'dynamical decoupling', 'xy8', 'cpmg', 'pulse', 'oscillation', 'sequence', 'ラビ', 'エコー', 'コヒーレント', 'パルス'] },
          { name: '光学系・スピン読み出し', color: '#0ea5e9', keywords: ['confocal', 'optical', 'fluorescence', 'readout', 'odmr', 'spin-to-charge', 'photoluminescence', '共焦点', '光学', '読み出し'] },
          { name: '走査プローブ・広視野イメージング', color: '#8b5cf6', keywords: ['imaging', 'mapping', 'scanning', 'afm', 'widefield', 'camera', 'イメージング', '走査', '広視野'] },
          { name: '材料・欠陥生成・表面ノイズ', color: '#14b8a6', keywords: ['defect', 'implantation', 'anneal', 'isotopically', 'nanocrystal', 'surface', 'strain', 'cvd', '材料', '欠陥', '表面'] },
          { name: '基礎物理・単一スピン', color: '#6366f1', keywords: ['electronic spin', 'individual', 'single', 'ground state', 'hyperfine', '基礎', '単一'] }
        ],
        target: [
          { name: 'レビュー・理論体系化', color: '#f59e0b', keywords: ['review', 'optimization', 'theoretical', 'framework', 'レビュー', '体系', '理論'] },
          { name: '単一スピン・ナノ磁気計測', color: '#0ea5e9', keywords: ['individual', 'single', 'nanoscale', 'nanometre', '3 nt', '単一', 'ナノ'] },
          { name: 'アンサンブル・高感度磁力計', color: '#10b981', keywords: ['ensemble', 'femtotesla', 'broadband', 'high-sensitivity', 'アンサンブル', '高感度'] },
          { name: '走査イメージング・生体/物性応用', color: '#ec4899', keywords: ['imaging', 'mapping', 'biological', 'cell', 'ambient', 'イメージング', '生体', '細胞'] },
          { name: 'スピン制御・基礎物理', color: '#6366f1', keywords: ['coherent', 'rabi', 'oscillation', 'confocal', 'odmr', '基礎', 'コヒーレント'] }
        ]
      };

      const rules = ruleSets[mode] || ruleSets.tech;
      const assignments = {};
      const usedRuleIndices = new Set();

      state.papers.forEach(p => {
        const text = getSearchText(p);
        let bestIdx = -1;
        let bestScore = 0;
        rules.forEach((r, idx) => {
          let score = 0;
          r.keywords.forEach(kw => {
            if (text.includes(kw)) score += (p.title.toLowerCase().includes(kw) ? 2 : 1);
          });
          if (score > bestScore) {
            bestScore = score;
            bestIdx = idx;
          }
        });
        if (bestIdx === -1) bestIdx = rules.length - 1;
        usedRuleIndices.add(bestIdx);
        assignments[p.id] = `prop_${bestIdx}`;
      });

      const finalThemes = [];
      const idRemap = {};
      Array.from(usedRuleIndices).sort((a, b) => a - b).forEach((rIdx, i) => {
        const tid = uid('theme');
        idRemap[`prop_${rIdx}`] = tid;
        finalThemes.push({ id: tid, name: rules[rIdx].name, color: rules[rIdx].color || palette[i % palette.length] });
      });

      Object.keys(assignments).forEach(pid => {
        assignments[pid] = idRemap[assignments[pid]];
      });

      return { themes: finalThemes, assignments };
    }

      let aiGuideText = '';

                <button type="button" data-prop-mode="custom" class="px-2.5 py-1 rounded-lg font-semibold border transition ${currentMode === 'custom' ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-700 border-slate-200 hover:border-emerald-400'}">自分の研究軸 / AI精密分類</button>
              </div>

              ${currentMode === 'custom' ? `

                      <button type="button" data-prop-move="${tIdx}:1" ${tIdx === proposal.themes.length - 1 ? 'disabled' : ''} class="px-1.5 py-0.5 text-[10px] bg-white border border-slate-200 rounded hover:bg-slate-100 disabled:opacity-30" title="右（下）へ移動">↓</button>

      };

      const mount = () => {
        openModal('横軸（分野・テーマ）の自動提案・振り分け', renderProposalBody());

        document.querySelectorAll('[data-prop-mode]').forEach(btn => {

            const parsed = await callGeminiJson(apiKey, prompt);
            const themes = names.map((name, i) => ({ id: uid('theme'), name, color: palette[i % palette.length] }));

            const prompt = `Group these academic papers into 5 to 8 fine-grained, research-specific Japanese theme lanes for a citation timeline map.${guidePart} Return strictly valid JSON: {"themes":[{"name":"Japanese lane name","paperIds":["id1",...]}]}. Every paper id must appear in exactly one theme.\nPapers: ${JSON.stringify(papersBrief)}`;
            const parsed = await callGeminiJson(apiKey, prompt);

    // =========================================================================
    // Expand Map from Selected Paper (Fetch Cited-By / References via OpenAlex)
    // =========================================================================
    async function ensurePaperOpenAlexData(p) {
      if (p.openAlexId && Array.isArray(p._referencedWorks)) return true;
      try {
        let data = null;
        if (p.doi && p.doi.trim()) {
          const cleanDoi = p.doi.trim().replace(/^https?:\/\/doi\.org\//i, '');
          const resp = await fetch(`https://api.openalex.org/works/https://doi.org/${encodeURIComponent(cleanDoi)}`);
          if (resp.ok) data = await resp.json();
        } else if (p.title && p.title.trim()) {
          const resp = await fetch(`https://api.openalex.org/works?search=${encodeURIComponent(p.title)}&per-page=1`);
          if (resp.ok) {
            const j = await resp.json();
            data = j.results?.[0] || null;
          }
        }
        if (data) {
          if (data.id) p.openAlexId = data.id;
          if (typeof data.cited_by_count === 'number') p.citations = data.cited_by_count;
          if (Array.isArray(data.referenced_works)) p._referencedWorks = data.referenced_works;
          if (Array.isArray(data.topics)) p.oaTopics = data.topics.slice(0, 4).map(t => t.display_name).filter(Boolean);
          if (Array.isArray(data.concepts)) p.oaConcepts = data.concepts.slice(0, 5).map(c => c.display_name).filter(Boolean);
          return true;
        }
      } catch (e) {
        return false;
      }
      return false;
    }

    async function openExpandPaperModal(paper, direction) {
      const isCitedBy = direction === 'citedBy';
      const title = isCitedBy
        ? `「${paper.shortAuthor} (${paper.year})」を引用している論文を取得`
        : `「${paper.shortAuthor} (${paper.year})」が引用している論文を取得`;

      openModal(title, `
        <div id="expandLoading" class="py-8 text-center text-xs text-slate-500 space-y-2">
          <div class="font-semibold text-slate-700">OpenAlexから関連論文を取得しています...</div>
          <div class="text-[11px]">被引用数の多い順に候補を取得します</div>
        </div>
      `);

      const ok = await ensurePaperOpenAlexData(paper);
      if (!ok || !paper.openAlexId) {
        document.getElementById('modalBody').innerHTML = `
          <div class="p-4 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-700">
            OpenAlexからこの論文のデータを取得できませんでした。DOIまたはタイトルが正しいか確認してください。
          </div>`;
        return;
      }

      let candidates = [];
      try {
        const shortId = paper.openAlexId.replace('https://openalex.org/', '');
        if (isCitedBy) {
          const resp = await fetch(`https://api.openalex.org/works?filter=cites:${encodeURIComponent(shortId)}&sort=cited_by_count:desc&per-page=20`);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          candidates = data.results || [];
        } else {
          const refs = (paper._referencedWorks || []).map(id => id.replace('https://openalex.org/', ''));
          if (refs.length === 0) {
            document.getElementById('modalBody').innerHTML = `
              <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600">
                この論文の参考文献リストがOpenAlexに登録されていませんでした。
              </div>`;
            return;
          }
          const batchSize = 40;
          const loadEl = document.getElementById('expandLoading');
          for (let i = 0; i < refs.length; i += batchSize) {
            const chunk = refs.slice(i, i + batchSize);
            if (loadEl) {
              loadEl.innerHTML = `<div class="font-semibold text-slate-700">参考文献をすべて取得中... (${Math.min(i + batchSize, refs.length)} / ${refs.length}件)</div>`;
            }
            const resp = await fetch(`https://api.openalex.org/works?filter=openalex_id:${chunk.join('|')}&per-page=50`);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            if (Array.isArray(data.results)) {
              candidates.push(...data.results);
            }
          }
          candidates.sort((a, b) => (b.cited_by_count || 0) - (a.cited_by_count || 0));
        }
      } catch (err) {
        document.getElementById('modalBody').innerHTML = `
          <div class="p-4 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-700">
            関連論文の取得に失敗しました (${escapeHtml(err.message)})。
          </div>`;
        return;
      }

      const baseYear = Number(paper.year);
      candidates = candidates.filter(w => {
        if (!w || !w.title) return false;
        if (w.id && paper.openAlexId && w.id === paper.openAlexId) return false;
        if (baseYear && w.publication_year) {
          if (!isCitedBy && Number(w.publication_year) > baseYear) return false;
          if (isCitedBy && Number(w.publication_year) < baseYear) return false;
        }
        return true;
      });
      if (candidates.length === 0) {
        document.getElementById('modalBody').innerHTML = `
          <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 text-xs text-slate-600">
            該当する関連論文が見つかりませんでした。
          </div>`;
        return;
      }

      const findExisting = (w) => {
        const wDoi = (w.doi || '').replace(/^https?:\/\/doi\.org\//i, '').toLowerCase();
        const wTitle = (w.title || '').toLowerCase();
        return state.papers.find(p =>
          (w.id && p.openAlexId === w.id) ||
          (wDoi && (p.doi || '').toLowerCase() === wDoi) ||
          p.title.toLowerCase() === wTitle
        );
      };

      const themeOpts = `<option value="__auto__" selected>自動振り分け（内容・トピックから判定）</option>` +
        state.themes.map(t =>
          `<option value="${t.id}">${escapeHtml(t.name)}</option>`
        ).join('');

      let newPrechecked = 0;
      document.getElementById('modalBody').innerHTML = `
        <div class="space-y-3 text-xs">
          <div class="flex flex-wrap items-center justify-between gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
            <div class="flex items-center gap-2">
              <span class="font-semibold text-slate-700">${isCitedBy ? `被引用 上位 ${candidates.length}件` : `参考文献 全 ${candidates.length}件`}（引用数順）</span>
              <button type="button" id="btnExpandSelectAll" class="px-2 py-0.5 text-[10px] font-semibold bg-white border border-slate-300 rounded hover:bg-slate-100">全選択</button>
              <button type="button" id="btnExpandDeselectAll" class="px-2 py-0.5 text-[10px] font-semibold bg-white border border-slate-300 rounded hover:bg-slate-100">全解除</button>
            </div>
            <div class="flex items-center gap-2">
              <label class="text-[11px] text-slate-600">配置先レーン:</label>
              <select id="expandTargetTheme" class="px-2 py-1 text-[11px] border border-slate-300 rounded-lg bg-white">${themeOpts}</select>
            </div>
          </div>

          <div class="space-y-1.5 max-h-[48vh] overflow-y-auto pr-1">
            ${candidates.map((w, idx) => {
              const existingP = findExisting(w);
              const firstA = w.authorships?.[0]?.author?.display_name || 'Unknown';
              const shortA = w.authorships?.length > 1 ? `${firstA} et al.` : firstA;
              const shouldCheck = !existingP && newPrechecked < 5;
              if (shouldCheck) newPrechecked++;
              return `
                <label class="flex items-start gap-2.5 p-2.5 rounded-xl border border-slate-200 hover:border-amber-400 cursor-pointer bg-white transition">
                  <input type="checkbox" data-exp-idx="${idx}" ${shouldCheck ? 'checked' : ''} class="mt-0.5 rounded border-slate-300 text-amber-500" />
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center justify-between gap-2">
                      <span class="font-bold text-slate-900 line-clamp-1">${escapeHtml(w.title)}</span>
                      <span class="shrink-0 text-[10px] font-bold px-1.5 py-0.5 rounded ${existingP ? 'bg-slate-100 text-slate-600' : 'bg-emerald-50 text-emerald-700'}">
                        ${existingP ? '登録済(線のみ追加)' : '新規'}
                      </span>
                    </div>
                    <div class="text-[11px] text-slate-500 mt-0.5">
                      ${escapeHtml(shortA)} (${w.publication_year || '?'}) · 引用 ${Number(w.cited_by_count || 0).toLocaleString()} · ${escapeHtml(w.primary_location?.source?.display_name || '')}
                    </div>
                  </div>
                </label>`;
            }).join('')}
          </div>

          <div class="flex justify-end gap-2 pt-2 border-t border-slate-200">
            <button type="button" id="btnCancelExpand" class="px-4 py-1.5 font-medium bg-slate-100 hover:bg-slate-200 rounded-lg">キャンセル</button>
            <button type="button" id="btnApplyExpand" class="px-4 py-1.5 font-semibold bg-slate-900 hover:bg-slate-800 text-white rounded-lg">選択した論文を追加＆結線</button>
          </div>
        </div>
      `;

      document.getElementById('btnExpandSelectAll').addEventListener('click', () => {
        document.querySelectorAll('[data-exp-idx]').forEach(cb => { cb.checked = true; });
      });
      document.getElementById('btnExpandDeselectAll').addEventListener('click', () => {
        document.querySelectorAll('[data-exp-idx]').forEach(cb => { cb.checked = false; });
      });
      document.getElementById('btnCancelExpand').addEventListener('click', closeModal);
      document.getElementById('btnApplyExpand').addEventListener('click', () => {
        const targetThemeId = document.getElementById('expandTargetTheme').value;
        const checked = Array.from(document.querySelectorAll('[data-exp-idx]:checked'))
          .map(cb => candidates[Number(cb.getAttribute('data-exp-idx'))]);

        if (checked.length === 0) {
          showToast('追加する論文を1つ以上選択してください');
          return;
        }

        let addedPapers = 0;
        let addedLinks = 0;

        checked.forEach(w => {
          let targetPaper = findExisting(w);
          if (!targetPaper) {
            const authorsList = (w.authorships || []).map(a => a.author?.display_name).filter(Boolean);
            const firstA = authorsList[0] || 'Unknown';
            targetPaper = {
              id: uid('paper'),
              title: w.title,
              authors: authorsList.join(', '),
              shortAuthor: authorsList.length > 1 ? `${firstA} et al.` : firstA,
              year: w.publication_year || paper.year,
              pubDate: w.publication_date || String(w.publication_year || paper.year || ''),
              journal: w.primary_location?.source?.display_name || '',
              doi: (w.doi || '').replace(/^https?:\/\/doi\.org\//i, ''),
              themeId: targetThemeId === '__auto__' ? autoAssignThemeForPaper({ title: w.title, summaryEn: reconstructAbstract(w.abstract_inverted_index), journal: w.primary_location?.source?.display_name || '', oaTopics: (w.topics || []).slice(0, 4).map(t => t.display_name), oaConcepts: (w.concepts || []).slice(0, 5).map(c => c.display_name) }, paper.themeId) : targetThemeId,
              citations: w.cited_by_count || 0,
              summary: '',
              summaryEn: reconstructAbstract(w.abstract_inverted_index),
              openAlexId: w.id || '',
              _referencedWorks: w.referenced_works || [],
              oaTopics: (w.topics || []).slice(0, 4).map(t => t.display_name).filter(Boolean),
              oaConcepts: (w.concepts || []).slice(0, 5).map(c => c.display_name).filter(Boolean),
              xOffset: 0
            };
            state.papers.push(targetPaper);
            if (!targetPaper.summaryEn && targetPaper.doi) {
              fetchAbstractFallback(targetPaper).then(ok => {
                if (ok) { saveState({ skipUndo: true }); renderInspector(); }
              });

            addedPapers++;
          }

          const sourceId = isCitedBy ? paper.id : targetPaper.id;
          const targetId = isCitedBy ? targetPaper.id : paper.id;
          const linkExists = state.links.some(l => l.sourceId === sourceId && l.targetId === targetId);
          if (!linkExists && sourceId !== targetId) {

    // =========================================================================
    // Google Sheets (GAS) Auto-Sync
    // =========================================================================
    const SYNC_STORAGE_KEY = 'citemap_cloud_sync_v1';
    let syncConfig = {
      gasUrl: '',
      token: '',
      autoLoad: true,
      autoSave: true
    };
    let _cloudPushTimer = null;

    function setSyncDot(status) {
      const dot = document.getElementById('cloudSyncDot');
      if (!dot) return;
      const map = {
        idle: 'bg-slate-300',
        syncing: 'bg-amber-400 animate-pulse',
        ok: 'bg-emerald-500',
        error: 'bg-rose-500'
      };
      dot.className = `w-2 h-2 rounded-full ${map[status] || map.idle}`;
    }

    function loadSyncConfig() {
      try {
        const raw = localStorage.getItem(SYNC_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            syncConfig = { ...syncConfig, ...parsed };
          }
        }
        // Support #sync=...&token=... hash for 1-click iPhone/iPad setup
        if (window.location.hash && window.location.hash.includes('sync=')) {
          const params = new URLSearchParams(window.location.hash.slice(1));
          const u = params.get('sync');
          if (u) {
            syncConfig.gasUrl = u;
            syncConfig.token = params.get('token') || '';
            syncConfig.autoLoad = true;
            syncConfig.autoSave = true;
            saveSyncConfig();
            history.replaceState(null, '', window.location.pathname + window.location.search);
          }
        }
      } catch (e) {}
      setSyncDot(syncConfig.gasUrl ? 'ok' : 'idle');
    }

    function saveSyncConfig() {
      try {
        localStorage.setItem(SYNC_STORAGE_KEY, JSON.stringify(syncConfig));
      } catch (e) {}
    }

    function scheduleCloudPush() {
      if (!syncConfig.gasUrl || !syncConfig.autoSave) return;
      clearTimeout(_cloudPushTimer);
      setSyncDot('syncing');
      _cloudPushTimer = setTimeout(() => {
        pushToGoogleSheets({ silent: true });
      }, 1500);
    }

    async function pushToGoogleSheets({ silent = false } = {}) {
      if (!syncConfig.gasUrl) {
        if (!silent) showToast('GAS WebアプリURLを設定してください');
        return false;
      }
      setSyncDot('syncing');
      try {
        const payload = {
          token: syncConfig.token || '',
          updatedAt: new Date().toISOString(),
          data: serializeCleanState()
        };
        const resp = await fetch(syncConfig.gasUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const res = await resp.json();
        if (res.status !== 'ok') throw new Error(res.message || 'Sync error');
        setSyncDot('ok');
        if (!silent) showToast('Googleスプレッドシートへ保存しました');
        return true;
      } catch (err) {
        setSyncDot('error');
        if (!silent) showToast(`保存に失敗しました: ${err.message}`);
        return false;
      }
    }

    async function pullFromGoogleSheets({ silent = false } = {}) {
      if (!syncConfig.gasUrl) {
        if (!silent) showToast('GAS WebアプリURLを設定してください');
        return false;
      }
      setSyncDot('syncing');
      try {
        const url = new URL(syncConfig.gasUrl);
        if (syncConfig.token) url.searchParams.set('token', syncConfig.token);
        const resp = await fetch(url.toString());
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const res = await resp.json();
        if (res.status !== 'ok') throw new Error(res.message || 'Read error');
        if (res.data && Array.isArray(res.data.themes) && Array.isArray(res.data.papers) && Array.isArray(res.data.links)) {
          if (silent && state.papers.length > 0 && res.data.papers.length === 0) {
            setSyncDot('ok');
            return true;
          }
          state.themes = res.data.themes;
          state.papers = res.data.papers;
          state.links = res.data.links;
          state.selectedPaperId = state.papers[0]?.id || null;
          state.selectedLinkId = null;
          saveState({ skipCloud: true });
          renderMap();
          renderInspector();
        }
        setSyncDot('ok');
        if (!silent) showToast('Googleスプレッドシートから最新データを読み込みました');
        return true;
      } catch (err) {
        setSyncDot('error');
        if (!silent) showToast(`読み込みに失敗しました: ${err.message}`);
        return false;
      }
    }

    const GAS_TEMPLATE_CODE = `// Googleスプレッドシートの「拡張機能 > Apps Script」に貼り付けて「デプロイ > 新しいデプロイ > ウェブアプリ」で公開してください
// アクセスできるユーザー: 「全員」 / 実行するユーザー: 「自分」
const SECRET_TOKEN = ''; // 必要なら合言葉を設定（空欄でも可）

function getSheet_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  return ss.getSheetByName('CiteMapData') || ss.insertSheet('CiteMapData');
}

function doGet(e) {
  const token = (e && e.parameter && e.parameter.token) || '';
  if (SECRET_TOKEN && token !== SECRET_TOKEN) {
    return jsonOut_({ status: 'error', message: 'Invalid token' });
  }
  const sheet = getSheet_();
  const lastRow = Math.max(1, sheet.getLastRow());
  const vals = sheet.getRange(1, 1, lastRow, 1).getValues().map(r => r[0]);
  let raw = '';
  for (let i = 0; i < vals.length; i++) {
    const v = String(vals[i] || '');
    if (v.startsWith('Updated:')) break;
    raw += v;
  }
  const data = raw ? JSON.parse(raw) : null;
  return jsonOut_({ status: 'ok', data });
}

function doPost(e) {
  const body = JSON.parse(e.postData.contents || '{}');
  if (SECRET_TOKEN && body.token !== SECRET_TOKEN) {
    return jsonOut_({ status: 'error', message: 'Invalid token' });
  }
  const sheet = getSheet_();
  const str = JSON.stringify(body.data || {});
  const chunkSize = 40000;
  const rows = [];
  for (let i = 0; i < str.length; i += chunkSize) {
    rows.push([str.slice(i, i + chunkSize)]);
  }
  if (rows.length === 0) rows.push(['{}']);
  rows.push(['Updated: ' + (body.updatedAt || new Date().toISOString())]);
  sheet.clearContents();
  sheet.getRange(1, 1, rows.length, 1).setValues(rows);
  return jsonOut_({ status: 'ok' });
}

function jsonOut_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}`;

    let _cachedGeminiModel = '';

    async function callGeminiJson(apiKey, prompt) {
      const candidates = _cachedGeminiModel
        ? [_cachedGeminiModel, 'gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite', 'gemini-2.5-flash']
        : ['gemini-3.8-flash', 'gemini-3.6-flash', 'gemini-3.5-flash-lite', 'gemini-2.5-flash'];
      const tried = new Set();

      const tryModel = async (modelId) => {
        const cleanId = modelId.replace(/^models\//, '');
        if (tried.has(cleanId)) return null;
        tried.add(cleanId);
        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cleanId)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: 'application/json' }
          })
        });
        if (resp.status === 404) return { retryable: true, status: 404 };
        if (resp.status === 503 || resp.status === 429) {
          await new Promise(r => setTimeout(r, 700));
          return { retryable: true, status: resp.status };
        }
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        _cachedGeminiModel = cleanId;
        const txt = data.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
        return { parsed: JSON.parse(txt) };
      };

      for (const m of candidates) {
        const res = await tryModel(m);
        if (res && res.parsed) return res.parsed;
      }

      // Dynamic discovery via models.list if all static names 404
      const listResp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
      if (!listResp.ok) throw new Error(`HTTP ${listResp.status}`);
      const listData = await listResp.json();
      const usable = (listData.models || []).filter(m =>
        Array.isArray(m.supportedGenerationMethods) &&
        m.supportedGenerationMethods.includes('generateContent') &&
        /gemini/i.test(m.name) &&
        !/image|tts|audio|live|embedding/i.test(m.name)
      );
      usable.sort((a, b) => (/flash/i.test(b.name) ? 1 : 0) - (/flash/i.test(a.name) ? 1 : 0));
      for (const m of usable.slice(0, 4)) {
        const res = await tryModel(m.name);
        if (res && res.parsed) return res.parsed;
      }
      throw new Error('Geminiサーバーが混雑しています (HTTP 503)。数秒後にもう一度お試しください');
    }

    async function generatePaperAiSummary(p) {
      await fetchAbstractFallback(p);
      const apiKey = getGeminiApiKey();

      // 1. If Gemini API key is configured, generate structured EN + JA summary
      if (apiKey) {
        try {
          const prompt = `Summarize this academic paper concisely in both Japanese and English (2-3 sentences covering objective, method, and key finding). Return strictly valid JSON with keys "ja" and "en".\nTitle: ${p.title}\nAuthors: ${p.authors || p.shortAuthor}\nYear: ${p.year}\nAbstract: ${p.summaryEn || p.summary || '(Not available, infer cautiously from title only)'}`;
          const parsed = await callGeminiJson(apiKey, prompt);
          if (parsed.ja || parsed.en) {
            p.aiSummary = parsed.ja || '';
            p.aiSummaryEn = parsed.en || '';
            return true;
          }
        } catch (e) {
          // Fall through to Semantic Scholar TL;DR fallback
        }
      }

      // 2. Zero-setup fallback: Semantic Scholar TL;DR + automatic translation
      let enTldr = '';
      try {
        let url = '';
        if (p.doi && p.doi.trim()) {
          const cleanDoi = p.doi.trim().replace(/^https?:\/\/doi\.org\//i, '');
          url = `https://api.semanticscholar.org/graph/v1/paper/DOI:${encodeURIComponent(cleanDoi)}?fields=tldr,abstract`;
        } else if (p.title) {
          url = `https://api.semanticscholar.org/graph/v1/paper/search?query=${encodeURIComponent(p.title)}&fields=tldr,abstract&limit=1`;
        }
        if (url) {
          const resp = await fetch(url);
          if (resp.ok) {
            const json = await resp.json();
            const item = Array.isArray(json.data) ? json.data[0] : json;
            if (item?.tldr?.text) enTldr = item.tldr.text;
            if (!p.summaryEn && item?.abstract) p.summaryEn = item.abstract;
          }
        }
      } catch (e) {}

      // 3. Fallback to first 2 sentences of abstract if TL;DR unavailable
      if (!enTldr && p.summaryEn) {
        const sents = p.summaryEn.split(/(?<=[.!?])\s+/);
        enTldr = sents.slice(0, 2).join(' ');
      }

      if (enTldr) {
        p.aiSummaryEn = enTldr;
        const ja = await translateText(enTldr, 'ja');
        if (ja) p.aiSummary = ja;
        return true;
      }

      if (p.summary) {
        p.aiSummary = p.summary.slice(0, 140) + (p.summary.length > 140 ? '...' : '');
        return true;
      }

      return false;
    }

    async function batchGenerateAiSummaries() {
      const targets = state.papers.filter(p => !p.aiSummary && !p.aiSummaryEn);
      if (targets.length === 0) {
        showToast('すべての論文にAI要約が登録されています');
        return;
      }
      showToast(`${targets.length}件の論文にAI要約を生成中...`);
      let done = 0;
      for (const p of targets) {
        const ok = await generatePaperAiSummary(p);
        if (ok) done++;
      }
      if (done > 0) {
        saveState();
        renderInspector();
        showToast(`${done}件の論文にAI要約を追加しました`);
      } else {
        showToast('AI要約を生成できませんでした');
      }
    }
